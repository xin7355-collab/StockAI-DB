name: 📦 打包 APK（安卓安裝檔）

# ⛔ 只能手動觸發 —— 它不碰 gh-pages、不碰 data、不碰採礦,純粹產出一個可下載的 .apk
#    APK 只是把網站包成安卓外殼(TWA),裡面載的還是線上那份 index.html
#    → 以後 App 更新**不需要**重新打包,只有改圖示/名稱/套件名才要重打
on:
  workflow_dispatch:

permissions:
  contents: write   # 發佈 Release 需要(讓手機能直接下載 .apk,不用解壓縮)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: ☕ JDK 17（Android Gradle Plugin 8.x 需要）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔖 版本號跟著 App 走
        run: |
          set -e
          V=$(grep -oE "_APP_VERSION: ?['\"]V[0-9.]+" index.html | head -1 | grep -oE "[0-9.]+" || true)
          if [ -z "$V" ]; then V="1.0.0"; fi
          echo "TWA_VERSION_NAME=$V"        >> "$GITHUB_ENV"
          echo "TWA_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "APK_NAME=stockai-v${V}-b${{ github.run_number }}.apk" >> "$GITHUB_ENV"
          echo "版本 $V ・ versionCode ${{ github.run_number }}"

      # 🖼️ 圖示是**事先產好進版控**的,⛔ 不在 CI 轉檔 ——
      #    run #1 就是栽在這:runner 上根本沒有 ImageMagick,而且 set -e 讓它連錯誤訊息都印不出來
      #    (IM=$(command -v ...) 這種賦值失敗會直接中止,不像 `a && b` 有豁免)
      - name: 🖼️ 確認 App 圖示齊全
        run: |
          set -e
          N=$(find android/app/src/main/res -name ic_launcher.png | wc -l)
          find android/app/src/main/res -name ic_launcher.png | sort
          # 空過守門:少一張就別往下走(避免打出沒有圖示的 APK)
          if [ "$N" -ne 5 ]; then echo "❌ 圖示只有 $N 張,應為 5 張"; exit 1; fi
          echo "✅ 圖示 5 種尺寸齊全"

      - name: 🔧 確認 Android SDK 元件
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi
          ls "$ANDROID_HOME/platforms" || true

      - name: 🏗️ 準備 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 🔨 打包 release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 🔐 驗簽章：必須跟 assetlinks.json 對得起來
        run: |
          set -e
          APK=android/app/build/outputs/apk/release/app-release.apk
          [ -s "$APK" ] || { echo "❌ 沒有產出 APK"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then echo "❌ 找不到 build-tools"; exit 1; fi
          # -v 會印出「v1/v2/v3 各自有沒有驗過」→ 日後有人說裝不起來,log 裡直接看得到
          "$BT/apksigner" verify -v "$APK" | head -8
          echo "APK 大小:$(stat -c%s "$APK") bytes ・ 檔案型別:$(file -b "$APK" | cut -c1-60)"
          GOT=$("$BT/apksigner" verify --print-certs "$APK" \
                | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          WANT=$(grep -oE '[0-9A-Fa-f]{2}(:[0-9A-Fa-f]{2}){31}' .well-known/assetlinks.json \
                | head -1 | tr -d ':' | tr 'A-Z' 'a-z')
          echo "APK  : $GOT"
          echo "網站 : $WANT"
          # 兩邊都要真的讀到東西,⛔ 不可讓「空 == 空」矇混過關
          if [ -z "$GOT" ] || [ -z "$WANT" ]; then echo "❌ 指紋讀不到(APK:${#GOT} 網站:${#WANT})"; exit 1; fi
          # ⛔ 對不起來就代表裝上去頂端會有網址列 → 直接失敗,別讓人白裝一次
          [ "$GOT" = "$WANT" ] || { echo "❌ 簽章與 assetlinks.json 不符"; exit 1; }
          echo "✅ 簽章與網站對得起來,裝上去會是全螢幕"
          cp "$APK" "$APK_NAME"
          ls -lh "$APK_NAME"

      # 📲 Artifacts 一律會被壓成 zip,手機點下去只會拿到壓縮檔 → 裝不起來。
      #    Release 的附件是**原檔**,手機點連結就直接下載 .apk。
      - name: 📲 發佈到 Releases（手機可直接下載，⛔ 不用解壓縮）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="apk-v${TWA_VERSION_NAME}-b${{ github.run_number }}"
          # ⚠️ 說明文字一律走檔案 —— 多行字串直接寫在 --notes 後面,
          #    續行會頂到第 0 欄而跳出 YAML 的 block scalar,整支 workflow 解析失敗
          # ⚠️ 一律用 printf 逐行寫,⛔ 不用 heredoc ——
          #    heredoc 的結束標記必須頂到第 0 欄,那又會跳出 YAML 的 block scalar;
          #    而把內文縮排的話,10 個空白在 Markdown 會被當成程式碼區塊。
          printf '%s\n' \
            '手機直接點下面的 `.apk` 就能裝（⛔ 不用解壓縮）。' \
            '' \
            '安裝後開 ⚙️ 設定中心，版本號旁邊會顯示 🤖。' \
            '' \
            '⚠️ 顯示「**應用程式未安裝**」→ 手機上有同名的舊版（或別處打包的同一個 App），' \
            '簽章不同安卓一定會擋。先到「設定 → 應用程式」把舊的移除，再裝一次。' \
            '' \
            '⚠️ 安卓專用。iPhone 請用 Safari → 分享 → 加入主畫面。' \
            '' \
            '⭐ 以後 App 更新**不需要**重裝這個檔 —— 它載的就是線上網站。' \
            > /tmp/apk_notes.md
          gh release create "$TAG" "$APK_NAME" \
            --title "散戶救星 APK v${TWA_VERSION_NAME}" \
            --latest --notes-file /tmp/apk_notes.md
          echo "✅ 已發佈:$TAG"

      - name: ⬆️ 上傳 APK（到這個 run 的 Artifacts 下載）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 30
          # ⚠️ 這是 YAML block scalar,行尾不可寫註解(註解只能寫在 path: 這行之上)
          path: |
            ${{ env.APK_NAME }}
