name: 🔄 全市場基本面輪動採礦

# 每小時抓「下一批 150 檔」單檔財報(FinMind 免費版單檔抓得到,bulk 回 0),
# 併進 data/fundamentals_rotation.json(自己的累積檔,游標滾動),全市場約 14 小時輪一圈。
# ⚠️ 只寫 fundamentals_rotation.json;絕不動 daily_miner 的 fundamentals_cache.json / OHLCV / 分點。
# 持久化:推到 data 分支 → daily_miner deploy 的 `git archive origin/data` 會保留它,force-push 不會蓋掉。

# 🚨 V75.2.0 排程配額:這支的 cron **從來沒有被觸發過**(實測見下),所以改成
#   「**跟在一支實測跑得到的 workflow 後面**」—— GitHub 的 `workflow_run` 事件
#   不是 schedule,⛔ 不吃排程配額。
#   📊 實測(2026-09-09,`actions_list` 近 9 天全 repo 的 schedule run):
#      總共只有 **100 筆**進得來,而所有 cron 加起來要求約 **250 筆** → 六成被丟掉,
#      而且被丟掉的是**固定那幾支**(macro_cron / news_express / rotation_probe /
#      stock_futures / insider_cron **五支全部 0 筆**),不是隨機。
#   ⛔ 連「一天只要 1 次」的 insider_cron 也是 0 → CLAUDE.md 舊寫的
#      「每天 1~3 次在這個 repo 100% 可靠」**被這個反例推翻**(fund_sweep 同樣 1 次/天卻正常)。
#   ⚠️ cron 一行都沒刪 —— 萬一哪天配額鬆了它自己會跑;`workflow_run` 只是多一條進得來的路。
on:
  # ⭐ 跟車:下面這幾支是實測「排程真的進得來」的(⛔ 改它們的名字要同步改這裡)
  workflow_run:
    workflows:
      - "🌙 夜間全市場基本面補齊 (fund_sweep)"
    types: [completed]
  schedule:
    - cron: '23 1,4,7,13 * * 1-5'   # ⚡ V69.8.6 P3-1:原每小時 24/7(月營收月更/財報季更卻每小時輪詢,每週 ~75,600 次 FinMind 呼叫);改交易日 4 輪仍 3 天滾完全市場,額度降 ~85%
  workflow_dispatch:
    inputs:
      batch:
        description: '本輪抓幾檔(預設 150)'
        required: false
        default: '150'

# 自己的 group(不與 deploy_pages 共用,避免純前端 push 觸發的部署把本輪 supersede 掉);
# 本檔用「additive 提交 + fetch/retry」推送,天生容忍 gh-pages 併發,不需共用序列化 group。
concurrency:
  group: rotation-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    # ⛔ 只跟「host 的**排程**那一輪」(同 playbook_scan 已驗證過的做法)——
    #   host 被手動 dispatch / push 觸發時⛔ 不跟,否則一天可能被帶跑好幾次。
    # ⚠️ 這裡**刻意不要求 host 成功** —— 這支採礦跟 host 的產物無關,
    #   host 失敗(例如 runner 配不出來)不該連累它。
    # ⚠️ 手動 dispatch 與原本的 cron 備援不受這個 if 影響(它們的 event 不是 workflow_run)。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 裝 requests
        run: pip install --quiet requests

      - name: 📂 拉 data 分支(universe + 既有累積檔 + 游標)
        run: |
          git fetch origin data --depth=1 2>&1 || echo "⚠️ data 分支拉取失敗"
          git checkout FETCH_HEAD -- data/ 2>&1 || echo "⚠️ data/ 取出失敗(首次可能無)"
          ls data/*.json 2>/dev/null | grep -cE '/[0-9]{4}\.json' | xargs echo "個股 universe:"

      - name: 🔄 跑輪動採礦
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          ROTATION_BATCH_N: ${{ github.event.inputs.batch || '150' }}
        run: python3 rotation_miner.py

      - name: 📋 印摘要
        if: always()
        run: |
          python3 -c "import json;d=json.load(open('data/fundamentals_rotation.json'));print('status',d.get('__status'));print('cursor',d.get('__cursor'),'/',d.get('__universe'))" 2>/dev/null || echo "(無累積檔)"

      - name: 🌐 推 fundamentals_rotation.json → data 分支(持久)+ gh-pages(前端即時)
        run: |
          set +e
          [ -f data/fundamentals_rotation.json ] || { echo "無累積檔,跳過"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/rot && cp data/fundamentals_rotation.json /tmp/rot/

          push_to () {   # $1 = 分支名
            local BR="$1"
            for i in 1 2 3 4 5; do
              git fetch origin "$BR" --depth=1 2>/dev/null || { echo "  ⚠️ $BR 不存在,跳過"; return 0; }
              git checkout -f -B "_rot_$BR" FETCH_HEAD 2>/dev/null || { echo "  ⚠️ checkout $BR 失敗"; return 0; }
              mkdir -p data && cp /tmp/rot/fundamentals_rotation.json data/fundamentals_rotation.json
              git add -f data/fundamentals_rotation.json
              if git diff --cached --quiet; then echo "  $BR 無變更"; return 0; fi
              git commit -q -m "🔄 基本面輪動更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
              if git push origin "HEAD:$BR" 2>&1; then echo "  ✅ $BR push 成功 ($i)"; return 0; fi
              [ "$i" -eq 5 ] && { echo "  ❌ $BR push 連 5 次失敗"; return 0; }
              echo "  ⚠️ $BR push $i 失敗,sleep $((i*3))s 後重試"; sleep $((i*3))
            done
          }

          push_to data       # 持久層(daily_miner archive 靠它保命)
          push_to gh-pages   # 前端即時讀
          echo "✅ 輪動推送完成"
