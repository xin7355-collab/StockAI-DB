name: 📼⏪ 5 分 K 歷史回補 (kbar5_deep)

# 📼⏪ 把 5 分 K 往回補到 Shioaji 真正的地板(目標 2021-04 起,涵蓋 2022 空頭)
#    → 獨立分支 `kbar5_deep` 的 kbar5_deep/{YYYY-MM}.json.gz(格式同 kbar5,每天多一個 bf:1)。
#    使用者 2026-09-23:「5分k資料歷史挖礦,我要馬上就能測試的」。
#
# ⛔ 五個刻意的設計(理由寫在 kbar5_backfill.py 檔頭):
#   ① 獨立分支,⛔ 不寫進 kbar5(那邊 KEEP_MONTHS=12 會把一年前的月檔修掉)
#   ② 母體 = 每月初重選「前 60 日平均成交值前 100」(使用者選的;零前視,selftest 釘住)
#   ③ 可中斷可接續(月檔記 done/miss)→ 由新到舊抓,最近一年最先可測
#   ④ 兩道預算:時間到 → **自己再觸發一輪接力**(最多 8 棒);流量 85% → 停,等隔天
#   ⑤ 🔐 只給行情金鑰(SHIOAJI_API_KEY/SECRET_KEY);⛔ 不給任何下單憑證(repo 是公開的)
#
# 🚨 誰來觸發(⛔ 不新開 cron —— 排程配額早就不夠用,見 CLAUDE.md V73.9.0 / V75.2.0):
#    ① 手動 Run(第一次先 depth_only=1 量地板)
#    ② 時間預算用完 → 這支自己 `gh workflow run` 接力(workflow_dispatch 用 GITHUB_TOKEN 觸發是允許的)
#    ③ 流量用完 → 掛在 `📼 5 分 K 逐日累積 (kbar5)` 後面(workflow_run,⛔ 不吃排程配額),
#       每天收盤後自動接著補;全部補完之後每天只會「登入 → 發現沒事 → 結束」。

on:
  workflow_dispatch:
    inputs:
      depth_only:
        description: '只量 Shioaji 分K 的真正地板(1 = 只量不抓)'
        required: false
        default: '0'
      from:
        description: '最早補到哪個月(YYYY-MM)'
        required: false
        default: '2021-04'
      budget_min:
        description: '這一輪最多跑幾分鐘(到了就存檔接力)'
        required: false
        default: '300'
      chain:
        description: '(內部用)第幾棒接力'
        required: false
        default: '0'
  workflow_run:
    workflows: ["📼 5 分 K 逐日累積 (kbar5)"]
    types: [completed]

concurrency:
  group: kbar5-deep-backfill
  cancel-in-progress: false     # 長工作,⛔ 不可被第二次觸發砍掉(執行時間 ≫ 觸發間隔)

permissions:
  contents: write
  actions: write                # 接力用(gh workflow run)

jobs:
  backfill:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 350
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝 shioaji
        run: pip install "shioaji<1.7"   # 📌 同 kbar5 / live_snapshot:1.7 移除 login(fetch_contract=)

      # ⚠️ 用 git archive | tar(⛔ 不用 git checkout —— 會把整批 stage 進 index 弄髒工作區,V49.4)
      - name: 📂 還原 klines_deep(算母體用)與 kbar5_deep(接續用)
        run: |
          for b in klines_deep kbar5_deep; do
            git fetch origin "$b" --depth=1 2>/dev/null || echo "ℹ️ $b 分支還不存在"
            mkdir -p "$b"
            if git rev-parse --verify -q "origin/$b" >/dev/null; then
              git archive "origin/$b" | tar -x -C . 2>/dev/null || true
            fi
            echo "📂 $b:$(ls $b/*.json.gz 2>/dev/null | wc -l) 檔"
          done
          N=$(ls klines_deep/*.json.gz 2>/dev/null | wc -l)
          [ "$N" -ge 500 ] || { echo "❌ klines_deep 只有 $N 檔(<500)→ 算不出母體,⛔ 不可拿半份湊"; exit 1; }
          du -sb kbar5_deep 2>/dev/null | cut -f1 > /tmp/kbar5_deep.old_bytes || echo 0 > /tmp/kbar5_deep.old_bytes

      # ⚠️ selftest 跟正式跑寫在同一個 step(check_script_secrets:同一支腳本同一個機密不可一邊給一邊不給)
      - name: 📼⏪ selftest → 回補
        id: run
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
          # 🔧 workflow_run 觸發時 inputs.* 是**空字串** → Python 端一律 `or 預設`
          KBAR5B_DEPTH_ONLY: ${{ github.event.inputs.depth_only }}
          KBAR5B_FROM: ${{ github.event.inputs.from }}
          KBAR5B_BUDGET_MIN: ${{ github.event.inputs.budget_min }}
        run: |
          python3 kbar5_backfill.py --selftest
          python3 kbar5_backfill.py

      - name: 🚀 推上 kbar5_deep 分支
        run: |
          set -e
          ls kbar5_deep/* >/dev/null 2>&1 || { echo "ℹ️ 沒有任何產物(depth_only 且第一次)→ 不推"; exit 0; }
          NEW=$(du -sb kbar5_deep | cut -f1); OLD=$(cat /tmp/kbar5_deep.old_bytes 2>/dev/null || echo 0)
          # 🚧 orphan force-push 會整個取代 → 新的不可比舊的小(⛔ 不可用半份蓋掉)
          if [ "$NEW" -lt "$OLD" ]; then echo "❌ 產物 $NEW bytes < 分支上的 $OLD → 拒絕推送"; exit 1; fi
          echo "📦 $OLD → $NEW bytes ・$(ls kbar5_deep/*.json.gz 2>/dev/null | wc -l) 個月檔"
          cp -r kbar5_deep /tmp/kbar5_deep_out
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan _k5d_deploy
          git rm -rfq --cached . 2>/dev/null || true
          git clean -fdq -e kbar5_deep 2>/dev/null || true
          rm -rf kbar5_deep && cp -r /tmp/kbar5_deep_out kbar5_deep
          git add -f kbar5_deep/
          git commit -q -m "📼⏪ 5 分K 歷史回補 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push origin HEAD:kbar5_deep --force && { echo "✅ push 成功 (第 $i 次)"; break; }
            [ "$i" -eq 5 ] && { echo "❌ push 連 5 次失敗"; exit 1; }
            sleep $((i * 5))
          done
          echo "⏭️ 驗證⛔ 不可只看綠燈:git show origin/kbar5_deep:kbar5_deep/_meta.json"

      # 🔁 只有「時間預算用完」才接力;流量用完 → 等明天 kbar5 跑完的 workflow_run
      - name: 🔁 接力(時間用完且還有沒補的)
        if: steps.run.outputs.more == '1' && steps.run.outputs.reason == 'time'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain }}
          FROM: ${{ github.event.inputs.from }}
        run: |
          C=$(( ${CHAIN:-0} + 1 ))
          if [ "$C" -gt 8 ]; then echo "⛔ 已經接力 8 棒 → 停(防無限迴圈);剩 ${{ steps.run.outputs.left }} 個(月×檔)等明天"; exit 0; fi
          gh workflow run kbar5_backfill.yml --ref main -f chain="$C" -f from="${FROM:-2021-04}" -f budget_min=300
          echo "🔁 已觸發第 $C 棒(剩 ${{ steps.run.outputs.left }} 個 月×檔)"
