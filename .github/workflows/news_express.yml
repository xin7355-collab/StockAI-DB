name: 📰 即時新聞快訊 (news express)

# 🎯 目的:解決使用者問題「焦點動態快訊太久了」— 每 4 小時跑一次 universal_radar.py,
# 只更新 data/radar_news.json + global_news.json + tech_giants_news.json,不採礦 OHLCV
# (約 5-15 分鐘),保留 gh-pages 其他資料完整不動。
#
# 🌍 V72.3.3 排程改版(使用者要求:地緣政治突發 —— 川普說要打伊朗、伊朗打美軍那種)
#   舊排程 `0 1,5,9,13 * * 1-5` 有兩個大洞:
#     ① 盤中只有頭尾各一次(台北 09:00 → 13:00 中間空 4 小時,整段交易時間沒人看)
#     ② **週末完全不跑** → 週五 21:00 到週一 09:00 空白 **60 小時**,
#        而地緣衝突最常在週末爆 → 週一開盤跳空才知道。
#   新排程(UTC → 台北 +8):
#     ・平日 `0 1-5,9,13,17,21 * * 1-5` = 台北 09/10/11/12/13(盤中每小時)+ 17/21/隔日01/05
#     ・週末 `0 1,7,13,19 * * 6,0`      = 台北 09/15/21/03(每 6 小時,補週末缺口)
#   ⚠️ 用量:本 repo 是 public(GitHub Pages 免費方案的前提)→ Actions 分鐘數不計費,
#      舊註解寫的「2000 分免費額度」對 public repo 不適用(daily_miner 光 20 併發就遠超過)。
#   ⛔ 真正的限制是 **Groq 翻譯額度**:universal_radar 每輪最多翻 10 則、每則 sleep 2.5s,
#      而且「新聞無變化就跳過 commit」→ 沒事的時段實際成本很低。
on:
  schedule:
    - cron: "0 1-5,9,13,17,21 * * 1-5"
    - cron: "0 1,7,13,19 * * 6,0"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "universal_radar.py"
      - ".github/workflows/news_express.yml"

permissions:
  contents: write

# 🔒 避免跟 daily_miner.yml 同時 force-push gh-pages 互相打架
concurrency:
  group: gh-pages-push   # 🩹 V69.8.4 P0-7:原拼成 gh-pages-deploy(全專案其他 13 支都是 gh-pages-push)→ 完全沒序列化,09:00 UTC 那輪必被 daily_miner force-push 蓋掉白跑
  cancel-in-progress: false

jobs:
  news_express:
    name: 📰 抓即時新聞 + 更新 gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 安裝相依套件
        run: pip install requests feedparser --quiet

      # 🗞️ V74.2.8 消息面**歷史**是累積型檔案 → ⛔ 一定要先還原,否則每輪從零重寫、
      #    歷史永遠只有今天(而且完全不會報錯)。同 chips_deep / tick_hist / mgr_hist 的做法。
      #    ⚠️ 還原不到就從空的開始(第一次跑本來就沒有);腳本自己有「天數變少就拒絕覆蓋」的守門。
      - name: 🗞️ 還原消息面歷史(累積型檔案)
        continue-on-error: true
        run: |
          mkdir -p data
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          if git show origin/gh-pages:data/news_hist.json > data/news_hist.json 2>/dev/null && [ -s data/news_hist.json ]; then
            python -c "import json;d=json.load(open('data/news_hist.json'));print('  ↩️ 還原消息面歷史:%d 天' % len(d.get('days') or {}))"
          else
            rm -f data/news_hist.json
            echo "  ℹ️ gh-pages 上還沒有 news_hist.json(第一次跑)→ 從空的開始"
          fi

      - name: 📰 執行 universal_radar.py 抓 RSS + AI 翻譯
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
        run: python universal_radar.py || echo "⚠️ universal_radar.py 非零退出,仍繼續部署已產出的部分"

      - name: 💾 暫存產出的新聞 JSON
        run: |
          mkdir -p /tmp/news
          cp data/radar_news.json       /tmp/news/ 2>/dev/null || echo "⚠️ radar_news.json 未產出"
          cp data/global_news.json      /tmp/news/ 2>/dev/null || true
          cp data/tech_giants_news.json /tmp/news/ 2>/dev/null || true
          cp data/stock_news.json       /tmp/news/ 2>/dev/null || true
          cp data/news_hist.json        /tmp/news/ 2>/dev/null || true   # 🗞️ V74.2.8 消息面歷史(累積型)
          # 🚨 下一步會 `git checkout gh-pages` —— **那個分支上沒有 scripts/**
          #    (它只放 index.html / pro.html / data/)→ 守門腳本一定要先複製出來,
          #    ⛔ 否則那行會靜默失敗、守門等於不存在(CLAUDE.md 記過的同型陷阱)。
          cp scripts/news_hist_guard.py /tmp/news/ 2>/dev/null || echo "⚠️ 守門腳本沒複製到"


      - name: 🌐 更新 gh-pages(只覆蓋 3 個新聞 JSON,保留股票資料)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 切到現有 gh-pages(非 orphan,保留所有股票資料)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || {
            echo "❌ gh-pages 不存在,跳過部署(等 daily_miner 先建立)"
            exit 0
          }

          mkdir -p data
          cp /tmp/news/radar_news.json       data/ 2>/dev/null || true
          cp /tmp/news/global_news.json      data/ 2>/dev/null || true
          cp /tmp/news/tech_giants_news.json data/ 2>/dev/null || true
          cp /tmp/news/stock_news.json       data/ 2>/dev/null || true
          # 🗞️ V74.2.8 🚧 **只增不減守門(這條才擋得住「還原失敗」)** ——
          #    腳本自己的守門只看得到本機那份;還原那步若失敗,它會以為「本來就沒有歷史」
          #    而寫出只有今天的一份 → 推上去就把幾百天洗掉了,而且完全不會報錯。
          if [ -s /tmp/news/news_hist.json ]; then
            git show HEAD:data/news_hist.json > /tmp/news/news_hist_prev.json 2>/dev/null || true
            python3 /tmp/news/news_hist_guard.py /tmp/news/news_hist.json /tmp/news/news_hist_prev.json || true
          fi
          cp /tmp/news/news_hist.json        data/ 2>/dev/null || true

          # ⚠️ 漏 git add = 「複製回去了但沒 commit」→ 每天被洗掉且零錯誤訊息(V73.1.3 的教訓)
          git add data/radar_news.json data/global_news.json data/tech_giants_news.json data/stock_news.json data/news_hist.json 2>/dev/null || true
          git diff --cached --quiet && echo "📭 新聞無變化,跳過 commit" || {
            git commit -m "📰 即時新聞更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin gh-pages
            echo "✅ gh-pages 新聞 JSON 已更新"
          }
