name: 🤖 每日籌碼採礦機

on:
  schedule:
    # 全台股分 5 批次，每 30 分鐘一批（台灣時間 16:30～18:30）
    - cron: '30 8 * * 1-5'   # 16:30 TW → 批次 0
    - cron: '0 9 * * 1-5'    # 17:00 TW → 批次 1
    - cron: '30 9 * * 1-5'   # 17:30 TW → 批次 2
    - cron: '0 10 * * 1-5'   # 18:00 TW → 批次 3
    - cron: '30 10 * * 1-5'  # 18:30 TW → 批次 4
  workflow_dispatch:
    inputs:
      batch_index:
        description: '批次索引 0-4（留空自動從時間判斷）'
        required: false
        default: 'auto'
      run_all_batches:
        description: '🚀 一鍵全市場採礦（5批次全跑，約 60-70 分鐘）'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  mine-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📥 下載程式碼（只要最新的腳本）
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: 🔢 判斷批次索引
        run: |
          INPUT="${{ github.event.inputs.batch_index }}"
          if [ -n "$INPUT" ] && [ "$INPUT" != "auto" ]; then
            echo "BATCH_INDEX=$INPUT" >> $GITHUB_ENV
            echo "TOTAL_BATCHES=5"   >> $GITHUB_ENV
          else
            NOW_MIN=$(( $(date -u '+%H') * 60 + $(date -u '+%M') ))
            if   [ $NOW_MIN -lt 530 ]; then IDX=0
            elif [ $NOW_MIN -lt 560 ]; then IDX=1
            elif [ $NOW_MIN -lt 590 ]; then IDX=2
            elif [ $NOW_MIN -lt 620 ]; then IDX=3
            else                            IDX=4
            fi
            echo "BATCH_INDEX=$IDX" >> $GITHUB_ENV
            echo "TOTAL_BATCHES=5"  >> $GITHUB_ENV
          fi
          echo "▶ 本次批次：BATCH_INDEX=${BATCH_INDEX:-?}"

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance fastapi httpx pydantic uvicorn duckduckgo-search feedparser

      - name: 📂 還原昨天的快取（data/ + futures/macro cache）
        run: |
          git fetch origin data --depth=1 2>/dev/null || echo "data 分支尚未建立"
          git checkout origin/data -- data/ 2>/dev/null || echo "首次執行，從零開始"
          # 還原 futures_cache.json / macro_cache.json（存在 gh-pages 根目錄）
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout origin/gh-pages -- futures_cache.json 2>/dev/null || true
          git checkout origin/gh-pages -- macro_cache.json   2>/dev/null || true
          echo "快取還原完成：$(ls futures_cache.json macro_cache.json 2>/dev/null | tr '\n' ' ')"

      - name: ⛏️ 執行採礦（OHLCV + 法人籌碼 + 融資融券 + 分點 + 美股）
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BATCH_INDEX: ${{ env.BATCH_INDEX }}
          TOTAL_BATCHES: ${{ env.TOTAL_BATCHES }}
        run: |
          if [ "${{ github.event.inputs.run_all_batches }}" == "true" ]; then
            echo "🚀 全批次採礦模式（5 批次，批次 1-4 略過法人/籌碼/期貨/美股）"
            for BATCH in 0 1 2 3 4; do
              echo "=== 批次 $BATCH ==="
              if [ $BATCH -eq 0 ]; then
                BATCH_INDEX=$BATCH TOTAL_BATCHES=5 python miner.py
              else
                BATCH_INDEX=$BATCH TOTAL_BATCHES=5 SKIP_GLOBAL=1 python miner.py
              fi
            done
          else
            python miner.py
          fi

      - name: 📡 通用情報雷達（RSS + Groq AI 情緒判讀）
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BATCH_INDEX: ${{ env.BATCH_INDEX }}
        run: |
          if [ "${BATCH_INDEX:-0}" = "0" ]; then
            python universal_radar.py || echo "⚠️ universal_radar.py 失敗，繼續部署"
          else
            echo "⚡ 非批次 0，跳過情報雷達"
          fi

      - name: 📡 部署所有資料到 gh-pages（股票K線 + 分點籌碼 + 快取）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # ── Step 1: 備份採礦結果 + 網站檔案到 /tmp（後續步驟都從這裡取）──
          mkdir -p /tmp/mine/data/chips
          cp data/*.json           /tmp/mine/data/          2>/dev/null || true
          cp data/chips/*.json     /tmp/mine/data/chips/    2>/dev/null || true
          cp futures_cache.json    /tmp/mine/                2>/dev/null || true
          cp macro_cache.json      /tmp/mine/                2>/dev/null || true
          cp broker_names.json     /tmp/mine/                2>/dev/null || true
          cp index.html            /tmp/mine/                2>/dev/null || true
          echo "備份完成：$(ls /tmp/mine/data/*.json 2>/dev/null | wc -l) K線，$(ls /tmp/mine/data/chips/*.json 2>/dev/null | wc -l) 分點"

          # ── Step 2: 用 orphan 分支 force-push，永遠只保留一個 commit，不累積歷史 ──
          git checkout main 2>/dev/null || true
          git checkout --orphan _pages_deploy
          git rm -rf --cached . -q 2>/dev/null || true

          # 複製所有網站所需檔案
          mkdir -p data/chips
          cp /tmp/mine/data/*.json          data/           2>/dev/null || true
          cp /tmp/mine/data/chips/*.json    data/chips/     2>/dev/null || true
          cp /tmp/mine/futures_cache.json   .               2>/dev/null || true
          cp /tmp/mine/macro_cache.json     .               2>/dev/null || true
          cp /tmp/mine/index.html           .               2>/dev/null || true
          cp /tmp/mine/broker_names.json    .               2>/dev/null || true

          STOCKS=$(ls data/*.json 2>/dev/null | wc -l)
          CHIPS=$(ls data/chips/*.json 2>/dev/null | wc -l)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          git add -f index.html data/
          [ -f broker_names.json ]  && git add -f broker_names.json  || true
          [ -f futures_cache.json ] && git add -f futures_cache.json || true
          [ -f macro_cache.json ]   && git add -f macro_cache.json   || true
          git commit -m "📡 網站更新 ${DATE}（批次 ${BATCH_INDEX}/${TOTAL_BATCHES} | K線 ${STOCKS} 檔 / 分點 ${CHIPS} 檔）"
          git push origin HEAD:gh-pages --force
          echo "✅ gh-pages 已更新：K線 ${STOCKS} 檔，分點籌碼 ${CHIPS} 檔"

      - name: 📤 推送到獨立 data 分支（永遠只保留一個 commit，不累積歷史）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 回到乾淨狀態後建 orphan 分支
          git checkout main 2>/dev/null || true
          git checkout --orphan _data_deploy
          git rm -rf --cached . -q 2>/dev/null || true

          # 從 /tmp 備份還原 data/
          mkdir -p data/chips
          cp /tmp/mine/data/*.json          data/        2>/dev/null || true
          cp /tmp/mine/data/chips/*.json    data/chips/  2>/dev/null || true
          git add -f data/

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          STOCKS=$(ls data/*.json 2>/dev/null | wc -l)
          git commit -m "🤖 籌碼快照 ${DATE}（批次 ${BATCH_INDEX}/${TOTAL_BATCHES}，${STOCKS} 檔）"
          git push origin HEAD:data --force
          echo "✅ data 分支已更新，共 ${STOCKS} 檔"
