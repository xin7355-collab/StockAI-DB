name: 🤖 每日籌碼採礦機 (平行宇宙版)

on:
  schedule:
    # 既然開啟了平行宇宙，我們只需要一個時間點觸發，5 台機器就會同時開工！
    # 這裡設定台灣時間 16:30 (UTC 8:30) 啟動全市場併發
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    # 手動觸發時，直接點擊 Run workflow，就會自動啟動 5 台機器併發！

permissions:
  contents: write

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 🚀 階段一：5 機齊發，各自採礦並上傳暫存區 (Artifacts)
  # ══════════════════════════════════════════════════════════════════════════
  mine:
    name: ⛏️ 採礦節點 ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60  # 每台只負責 20%，絕對不會超過 1 小時
    strategy:
      fail-fast: false   # 一台當機不要連累其他台
      matrix:
        batch: [0, 1, 2, 3, 4]  # 平行宇宙陣列

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/pip-packages.txt'

      - name: 📦 安裝相依套件
        run: |
          pip install requests yfinance fastapi httpx pydantic uvicorn duckduckgo-search feedparser

      - name: 📂 還原昨天的快取 (取得基準資料)
        run: |
          git fetch origin data --depth=1 2>/dev/null || echo "data 分支尚未建立"
          git checkout origin/data -- data/ 2>/dev/null || echo "從零開始"
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout origin/gh-pages -- futures_cache.json 2>/dev/null || true
          git checkout origin/gh-pages -- macro_cache.json   2>/dev/null || true

      - name: ⛏️ 執行採礦 (專屬節點 ${{ matrix.batch }})
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BATCH_INDEX: ${{ matrix.batch }}
          TOTAL_BATCHES: 5
        run: |
          # 只有節點 0 負責抓取全球總經/期貨/法人等共用資料，節點 1~4 只專心抓個股
          if [ "${{ matrix.batch }}" != "0" ]; then
            export SKIP_GLOBAL=1
          fi
          python miner.py

      - name: 📤 上傳該節點的採礦結果到暫存區
        uses: actions/upload-artifact@v4
        with:
          name: mine-data-${{ matrix.batch }}
          path: |
            data/
            futures_cache.json
            macro_cache.json
          retention-days: 1

  # ══════════════════════════════════════════════════════════════════════════
  # 🧬 階段二：等 5 台機器全數完工後，合併資料並統一發布
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 合併與部署總機
    needs: mine   # 必須等待上面 5 個 mine 節點全部完成才能啟動
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/pip-packages.txt'

      - name: 📦 安裝相依套件
        run: pip install requests duckduckgo-search feedparser

      - name: 📥 下載並自動合併 5 個平行宇宙的資料
        uses: actions/download-artifact@v4
        with:
          pattern: mine-data-*
          merge-multiple: true   # 最關鍵指令：將 5 包檔案完美合併為一個完整的 data/ 資料夾

      - name: 📡 通用情報雷達（RSS + Groq AI 情緒判讀）
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python universal_radar.py || echo "⚠️ universal_radar.py 失敗，繼續部署"

      - name: 📡 部署所有資料到 gh-pages (前端網站庫)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 備份合併後的完整資料
          mkdir -p /tmp/mine/data/chips
          cp data/*.json           /tmp/mine/data/          2>/dev/null || true
          cp data/chips/*.json     /tmp/mine/data/chips/    2>/dev/null || true
          cp futures_cache.json    /tmp/mine/               2>/dev/null || true
          cp macro_cache.json      /tmp/mine/               2>/dev/null || true
          cp broker_names.json     /tmp/mine/               2>/dev/null || true
          cp index.html            /tmp/mine/               2>/dev/null || true

          # 切換到發布分支
          git checkout main 2>/dev/null || true
          git checkout --orphan _pages_deploy
          git rm -rf --cached . -q 2>/dev/null || true

          # 還原資料並提交
          mkdir -p data/chips
          cp /tmp/mine/data/*.json          data/           2>/dev/null || true
          cp /tmp/mine/data/chips/*.json    data/chips/     2>/dev/null || true
          cp /tmp/mine/futures_cache.json   .               2>/dev/null || true
          cp /tmp/mine/macro_cache.json     .               2>/dev/null || true
          cp /tmp/mine/index.html           .               2>/dev/null || true
          cp /tmp/mine/broker_names.json    .               2>/dev/null || true

          STOCKS=$(ls data/*.json 2>/dev/null | wc -l)
          CHIPS=$(ls data/chips/*.json 2>/dev/null | wc -l)
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [ "$STOCKS" -lt 100 ]; then
            echo "❌ ABORT: 僅 $STOCKS 檔，拒絕強制覆寫 gh-pages 以保護現有資料"
            exit 1
          fi

          git add -f index.html data/
          [ -f broker_names.json ]  && git add -f broker_names.json  || true
          [ -f futures_cache.json ] && git add -f futures_cache.json || true
          [ -f macro_cache.json ]   && git add -f macro_cache.json   || true
          git commit -m "📡 網站更新 ${DATE}（平行宇宙合併 | K線 ${STOCKS} 檔 / 分點 ${CHIPS} 檔）"
          git push origin HEAD:gh-pages --force
          echo "✅ gh-pages 已更新：共 ${STOCKS} 檔"

      - name: 📤 推送到獨立 data 分支 (資料備份庫)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main 2>/dev/null || true
          git checkout --orphan _data_deploy
          git rm -rf --cached . -q 2>/dev/null || true

          mkdir -p data/chips
          cp /tmp/mine/data/*.json          data/        2>/dev/null || true
          cp /tmp/mine/data/chips/*.json    data/chips/  2>/dev/null || true

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          STOCKS=$(ls data/*.json 2>/dev/null | wc -l)

          if [ "$STOCKS" -lt 100 ]; then
            echo "❌ ABORT: 僅 $STOCKS 檔，拒絕強制覆寫 data 分支以保護現有資料"
            exit 1
          fi

          git add -f data/
          git commit -m "🤖 籌碼快照 ${DATE}（平行宇宙合併，共 ${STOCKS} 檔）"
          git push origin HEAD:data --force
          echo "✅ data 分支已更新"