name: 🤖 每日籌碼採礦機

on:
  schedule:
    # 每個交易日 台灣時間 16:30（UTC 08:30）執行，確保法人資料已公布
    - cron: '30 8 * * 1-5'
  workflow_dispatch:   # 允許手動在 GitHub 介面點擊觸發

permissions:
  contents: write

jobs:
  mine-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 下載程式碼（只要最新的腳本）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 安裝相依套件
        run: pip install requests

      - name: 📂 還原昨天的 data/ 快取（加速增量更新）
        run: |
          git fetch origin data --depth=1 2>/dev/null || echo "data 分支尚未建立，首次全量下載"
          git checkout origin/data -- data/ 2>/dev/null || echo "首次執行，從零開始"

      - name: ⛏️ 執行採礦（OHLCV + 法人籌碼 + 融資融券）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python miner.py

      - name: 📤 推送到獨立 data 分支（永遠只保留一個 commit，不累積歷史）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan _data_deploy
          git rm -rf --cached . -q 2>/dev/null || true

          git add -f data/

          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          STOCKS=$(ls data/*.json 2>/dev/null | wc -l)
          git commit -m "🤖 籌碼快照 ${DATE}（${STOCKS} 檔）"

          git push origin HEAD:data --force

          echo "✅ data 分支已更新，共 ${STOCKS} 檔"

      - name: 🔮 更新 gh-pages 外資期貨快取
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f futures_cache.json ]; then
            echo "⚠️  futures_cache.json 不存在，跳過"
            exit 0
          fi

          # 拉取 gh-pages 現有內容
          mkdir -p /tmp/gh_pages_update
          cp futures_cache.json /tmp/gh_pages_update/

          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || { echo "gh-pages 不存在，跳過"; exit 0; }

          cp /tmp/gh_pages_update/futures_cache.json .
          git add futures_cache.json
          git diff --cached --quiet && echo "無更新" || git commit -m "🔮 外資期貨快取 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin gh-pages
          echo "✅ gh-pages futures_cache.json 已更新"
