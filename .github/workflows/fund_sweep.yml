name: 🌙 夜間全市場基本面補齊 (fund_sweep)

# 🌙 每晚只抓「基本面(YoY/毛利/三率)」的輕量滾動採礦,把 daily_miner 只補 100 檔的
#    全市場冷門股(如帆宣 6196)逐晚補齊。輸出獨立檔 data/fund_yoy_gm.json,
#    不動 daily_miner 重建的 fundamentals_cache.json,daily deploy 用 git archive
#    origin/data 鋪底層會自動保留 → 不會被下午的完整採礦洗掉。
#
# 為何不影響白天:採礦用 GitHub Secrets 的 FINMIND_TOKENS + GitHub IP,跟你手機
#    前端 localStorage 的 key 是不同 token/IP,額度完全分開。

on:
  schedule:
    # 18:00 UTC(週一~五)= 台北 02:00(週二~六)凌晨,避開白天使用
    - cron: '0 18 * * 1-5'
  workflow_dispatch:
    inputs:
      budget:
        description: '本晚最多補幾檔(預設 500)'
        required: false
        default: '500'

# 與 deploy_pages.yml / daily_miner deploy 共用 group,避免同時 push 打架 (cannot lock ref)
concurrency:
  group: gh-pages-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 節流採礦可能跑 1-3 小時,給足時間(GitHub 上限 6h)
    steps:
      - name: 📥 下載程式碼 (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依 (只需 requests)
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 📂 還原所需資料 (origin/data → data/,只取兩檔,避免弄髒工作區)
        run: |
          git fetch origin data 2>/dev/null || echo "⚠️ 尚無 data 分支(首跑)"
          mkdir -p data
          # 只需宇宙來源 fundamentals_cache.json + 既有 fund_yoy_gm.json(可能不存在);分開取、各自容錯
          git show origin/data:data/fundamentals_cache.json > data/fundamentals_cache.json 2>/dev/null || echo "⚠️ 無 fundamentals_cache.json(首跑會略過)"
          git show origin/data:data/fund_yoy_gm.json > data/fund_yoy_gm.json 2>/dev/null || echo "ℹ️ 尚無 fund_yoy_gm.json(首次夜跑,從零建)"
          # 還原是用重導向寫檔(非 git checkout),不動 index;data/*.json 在 main 本就 gitignore → 工作區乾淨
          echo "還原後 data/ 檔案數:$(ls data 2>/dev/null | wc -l)"

      - name: 🌙 執行夜間基本面滾動補齊
        id: sweep
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          FUND_NIGHTLY_BUDGET: ${{ github.event.inputs.budget || '500' }}
          FUND_SLEEP: '3.0'
          FUND_MIN_HITS: '20'
        run: |
          set +e
          python3 fund_sweep.py
          rc=$?
          echo "sweep_rc=$rc" >> "$GITHUB_OUTPUT"
          # rc=0 成功要部署;rc=2 命中太少不部署;其他非 0 也不部署(保留舊檔)
          if [ "$rc" -ne 0 ]; then
            echo "⚠️ fund_sweep 回傳 $rc → 不部署,保留線上舊檔"
          fi
          exit 0

      - name: 🚀 部署 fund_yoy_gm.json 到 gh-pages + data (只更新這一檔)
        if: steps.sweep.outputs.sweep_rc == '0'
        run: |
          set -e
          if [ ! -f data/fund_yoy_gm.json ]; then
            echo "❌ 找不到 data/fund_yoy_gm.json,跳過部署"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先把產出存到 /tmp(data/ 在 main 是 gitignore 的未追蹤檔,切分支前要清乾淨)
          cp data/fund_yoy_gm.json /tmp/fund_yoy_gm.json

          deploy_branch () {
            local BR="$1"
            # 每次切分支前硬清:丟掉上一個分支的追蹤修改 + 未追蹤檔(含 data/),避免 checkout 因髒工作區 abort
            git reset --hard -q 2>/dev/null || true
            git clean -fdq 2>/dev/null || true
            git fetch origin "$BR" 2>/dev/null || true
            git checkout -f "$BR" 2>/dev/null || { echo "⚠️ 無 $BR 分支,跳過"; return 0; }
            git reset --hard -q "origin/$BR" 2>/dev/null || true
            mkdir -p data
            cp /tmp/fund_yoy_gm.json data/fund_yoy_gm.json
            git add -f data/fund_yoy_gm.json   # -f:該分支若也 gitignore data/*.json 仍強制加入
            if git diff --cached --quiet; then
              echo "ℹ️ $BR 無變更"; return 0
            fi
            git commit -m "🌙 夜間基本面補齊 fund_yoy_gm.json $(date -u '+%Y-%m-%d %H:%M UTC')" -q
            for i in 1 2 3 4 5; do
              if git push origin "$BR"; then echo "✅ $BR push 成功 (attempt $i)"; return 0; fi
              [ "$i" -eq 5 ] && { echo "❌ $BR push 連 5 次失敗"; return 1; }
              echo "⚠️ $BR push attempt $i 失敗,sleep $((i*5))s 重試…"; sleep $((i*5))
              git fetch origin "$BR" 2>/dev/null || true
              git reset --hard -q "origin/$BR" 2>/dev/null || true
              cp /tmp/fund_yoy_gm.json data/fund_yoy_gm.json
              git add -f data/fund_yoy_gm.json
              git commit -m "🌙 夜間基本面補齊 fund_yoy_gm.json $(date -u '+%Y-%m-%d %H:%M UTC')" -q 2>/dev/null || true
            done
          }

          # 先 gh-pages(前端讀這個,立即生效),再 data(讓 daily_miner deploy 的 git archive 保留)
          deploy_branch gh-pages
          deploy_branch data
          echo "✅ 夜間基本面已部署"
