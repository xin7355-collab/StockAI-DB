name: 🔬 盤中逐筆內外盤/大單 (Shioaji ticks)

# 用 Shioaji api.ticks 抓「當日量最大前 N 檔」的真實逐筆成交 → data/tick_flow.json
# 供:盤中作戰室「內外盤 / 大單」從估算升級成真實逐筆(冷門股仍用估算 fallback)
# ⚠️ 需 GitHub Secrets:SHIOAJI_API_KEY、SHIOAJI_SECRET_KEY(同 live_snapshot,已設好)
# 🧪 第一次請「Run workflow」手動觸發看 log,確認算到 >20 檔再靠 cron。
# 🚨🚨 V73.9.0 跟 live_snapshot 同一個架構改動:**排 1 次、自己在 job 裡迴圈**。
#    實測(2026-08-19 ~ 08-25)這支的 cron 要求 ~27 次/天,**實際 run = 0 筆**
#    —— 而且不是 `cancelled`,是 GitHub 連 run 都沒產生。V73.7.9 搬出共用 group 之後
#    仍然一筆都沒有 → 證明真正的瓶頸是「高頻 schedule 被丟棄」,不是 concurrency。
#    詳細對照表見 `scripts/intraday_window.py` 檔頭。
on:
  workflow_dispatch:
  schedule:
    - cron: '2 1 * * 1-5'    # 台北 09:02 —— 主迴圈(一路跑到 13:23)
    - cron: '32 2 * * 1-5'   # 台北 10:32 —— 接手(主迴圈掛了才有意義)

# 🚨🚨 `cancel-in-progress` 從 V73.7.9 的 **false 改成 true** —— 這是刻意推翻,
#    因為**那條規則的前提消失了**,⛔ 不是「順手統一」:
#    V73.7.9 寫的是「執行 12 分 vs cron 每 10 分 → 設 true 會讓它永遠跑不完」。
#    新架構下**已經沒有每 10 分鐘的 cron 了**(節拍在 job 裡面,跑完才排下一拍,
#    本來就不可能自己砍自己)。現在只剩每天 2 次的排程,而接手那一次
#    **必須殺得掉還活著的主迴圈**才能真的接手 → 只能是 true。
#    ⭐ 原本那條通用鐵則(`cancel-in-progress: true` 只有在「執行時間 ≪ 觸發間隔」時才安全)
#       **仍然成立** —— 現在的觸發間隔是 90 分鐘,執行是一拍 ~2 分鐘,條件本來就滿足。
# ⚠️ 可能與 deploy_pages / daily_miner 同時 push gh-pages → 靠下面既有的
#    「5 次 retry + fetch/pull --rebase」吸收(⛔ 不可拿掉)。
# ⛔ 別為了「避免打架」把它搬回共用的 `gh-pages-push`。
concurrency:
  group: gh-pages-intraday-tick
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tickflow:
    runs-on: ubuntu-latest
    # ⏱️ 窗口 09:02~13:23(台北)= 4 小時 21 分 → 給 280 分含收尾緩衝。
    #    ⚠️ 改 `intraday_window.py` 的 PROFILES['ticks'] 要同步改這裡。
    timeout-minutes: 280
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝 shioaji
        run: pip install "shioaji<1.7"   # 📌 1.7.0 移除 login(fetch_contract=) → 釘在 1.6.x 保留既有登入寫法

      # 📚 V72.0.2 tick_hist 是**累積型**檔案 → 必須先從 data 分支還原,否則每輪都從零開始
      #    ⚠️ 用 git show 而不是 git checkout(後者會把檔案 stage 進 index 弄髒工作區,V49.4 教訓)
      #    ⚠️ 必須 [ -s ] 驗非空,git show 失敗會留下空檔 → 歷史整份歸零
      - name: 📚 還原逐日歷史(tick_hist)
        run: |
          git fetch origin data --depth=1 2>/dev/null || true
          if git rev-parse --verify -q origin/data >/dev/null; then
            (git show origin/data:data/tick_hist.json > tick_hist.json 2>/dev/null && [ -s tick_hist.json ]) \
              || { rm -f tick_hist.json; echo "ℹ️ data 分支尚無 tick_hist.json(第一次跑)"; }
          fi
          [ -f tick_hist.json ] && echo "📚 已還原 $(wc -c < tick_hist.json) bytes" || echo "📚 從零開始累積"

      # ══════════════════════════════════════════════════════════════════════
      # 🔁 盤中常駐迴圈(V73.9.0)—— 一輪 = 採逐筆 + 部署 gh-pages + 同步 data 分支
      #    只 push 即時資料;daily_miner 下午洗掉無妨,下個交易日重建。
      # ══════════════════════════════════════════════════════════════════════
      - name: 🔁 盤中常駐迴圈(採逐筆 → 部署 → 等下一拍)
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 🚨 節拍計算器要複製出去 —— 每輪結束時工作區停在 data 分支,那裡沒有 scripts/。
          cp scripts/intraday_window.py /tmp/win.py
          # 🚧 空過守門:節拍計算器不能用的話,迴圈會一拍都不跑而且看起來很正常 → 直接紅燈
          python3 /tmp/win.py ticks >/dev/null || { echo "❌ 節拍計算器不能用"; exit 1; }
          # 📚 累積型的 tick_hist 也先備一份到 /tmp,切分支時才不會被弄丟
          [ -f tick_hist.json ] && cp tick_hist.json /tmp/th_keep.json || true

          deploy() {
            if [ ! -f tick_flow.json ]; then echo "❌ 沒產出 JSON,略過部署"; return 1; fi
            cp tick_flow.json /tmp/tf.json
            [ -f tick_hist.json ] && cp tick_hist.json /tmp/th.json || true

            git fetch origin gh-pages 2>/dev/null || true
            git checkout -f -B gh-pages origin/gh-pages 2>/dev/null || { echo "❌ gh-pages 不存在(等 daily_miner 先建)"; return 1; }

            mkdir -p data
            cp /tmp/tf.json data/tick_flow.json
            [ -f /tmp/th.json ] && cp /tmp/th.json data/tick_hist.json || true
            git add data/tick_flow.json
            [ -f data/tick_hist.json ] && git add data/tick_hist.json || true
            if git diff --cached --quiet; then
              echo "無變更,跳過"
            else
              git commit -q -m "🔬 盤中逐筆內外盤 $(date -u '+%Y-%m-%d %H:%M UTC')"
              # ⛔ 這個 retry 迴圈不可拿掉(唯一擋「同時 push gh-pages」的東西)
              local pushed=0
              for i in 1 2 3 4 5; do
                git push origin gh-pages 2>/dev/null && { echo "✅ push 成功 ($i)"; pushed=1; break; }
                sleep $((i*5))
                git fetch origin gh-pages 2>/dev/null || true
                git pull --rebase origin gh-pages 2>/dev/null || true
              done
              [ "$pushed" -eq 1 ] || { echo "❌ push 連 5 次失敗"; return 1; }
            fi
            echo "✅ data/tick_flow.json 已部署"

            # 🩹 V69.8.4 P0-2:也推 data 分支(否則 daily_miner orphan force-push 每輪抹掉
            #    → 盤後到隔日開盤前逐筆內外盤卡 404)。失敗不擋主流程。
            git reset --hard -q 2>/dev/null || true
            git clean -fdq -e '*.json' 2>/dev/null || true
            git fetch origin "+refs/heads/data:refs/remotes/origin/data" 2>/dev/null || true
            if git checkout -f -B data origin/data 2>/dev/null; then
              mkdir -p data
              cp /tmp/tf.json data/tick_flow.json
              [ -f /tmp/th.json ] && cp /tmp/th.json data/tick_hist.json || true
              git add -f data/tick_flow.json
              [ -f data/tick_hist.json ] && git add -f data/tick_hist.json || true
              if ! git diff --cached --quiet; then
                git commit -q -m "🔬 tick_flow → data 分支 $(date -u '+%Y-%m-%d %H:%M UTC')" -- data/tick_flow.json $([ -f data/tick_hist.json ] && echo data/tick_hist.json)
                git push origin data 2>/dev/null && echo "✅ data 分支也已同步" || echo "⚠️ data 分支 push 失敗(不擋主流程)"
              fi
            else
              echo "⚠️ 無 data 分支,跳過"
            fi
            return 0
          }

          once() {
            # 🚨 每輪開頭一定要回到主程式碼 —— 上一輪的 deploy 把我們留在 data 分支,
            #    那裡沒有 tick_flow_miner.py。⛔ 少了這行第二輪就開始失敗。
            git checkout -f "$BASE_SHA" >/dev/null 2>&1 || { echo "❌ 回不到主程式碼"; return 1; }
            rm -f tick_flow.json                      # ⛔ 免得採礦失敗時部署到上一輪的舊檔
            # 📚 tick_hist 是**累積型**,一定要還原回來才不會每一拍都從零開始
            [ -f /tmp/th_keep.json ] && cp /tmp/th_keep.json tick_hist.json || true
            python3 tick_flow_miner.py || return 1
            [ -f tick_hist.json ] && cp tick_hist.json /tmp/th_keep.json || true
            deploy || return 1
          }

          # ⭐ 先無條件跑一輪 —— **手動觸發(盤後測試)完全靠這輪**,⛔ 不可拿掉。
          FIRST_RC=0
          once || FIRST_RC=$?
          [ "$FIRST_RC" -eq 0 ] && echo "✅ 首輪完成" || echo "⚠️ 首輪失敗(rc=$FIRST_RC),仍進入迴圈"

          OKN=0; FAILN=0; STREAK=0
          while :; do
            S=$(python3 /tmp/win.py ticks)
            case "$S" in
              DONE)
                echo "🏁 窗口結束($(TZ=Asia/Taipei date '+%H:%M'))"; break ;;
              SLEEP*)
                sleep "${S#SLEEP }" ;;
              RUN)
                echo "──── ⏱️ $(TZ=Asia/Taipei date '+%H:%M:%S') 第 $((OKN+FAILN+1)) 拍 ────"
                if once; then OKN=$((OKN+1)); STREAK=0
                else FAILN=$((FAILN+1)); STREAK=$((STREAK+1)); fi
                if [ "$STREAK" -ge 5 ]; then echo "❌ 連 5 拍失敗,提前收工"; break; fi
                sleep 45 ;;
              *)
                echo "❌ 節拍計算器回了看不懂的東西:$S"; break ;;
            esac
          done

          echo "📊 本次共 成功 $OKN 拍 / 失敗 $FAILN 拍"
          # 🚧 空過守門(⛔ 不可無條件 exit 0 —— 那會變成「全綠但沒有資料」,陷阱 #9)
          if [ "$OKN" -eq 0 ] && [ "$FIRST_RC" -ne 0 ]; then
            echo "❌ 這次 run 完全沒有產出任何逐筆資料"; exit 1
          fi
