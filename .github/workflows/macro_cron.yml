name: 🌍 總經採礦定時同步 (macro 4hr cron)

# 每 4 小時跑 macro_miner.py → 同步 data/macro_risk.json 到 gh-pages
# 黃金 / 原油 / DXY / VIX / 亞股 數字小時級更新,不再卡每日 1 次採礦
# 不動 index.html / sw.js / 其他資料,與 daily_miner.yml / deploy_pages.yml 共存


# 🚨 V75.2.0 排程配額:這支的 cron **從來沒有被觸發過**(實測見下),所以改成
#   「**跟在一支實測跑得到的 workflow 後面**」—— GitHub 的 `workflow_run` 事件
#   不是 schedule,⛔ 不吃排程配額。
#   📊 實測(2026-09-09,`actions_list` 近 9 天全 repo 的 schedule run):
#      總共只有 **100 筆**進得來,而所有 cron 加起來要求約 **250 筆** → 六成被丟掉,
#      而且被丟掉的是**固定那幾支**(macro_cron / news_express / rotation_probe /
#      stock_futures / insider_cron **五支全部 0 筆**),不是隨機。
#   ⛔ 連「一天只要 1 次」的 insider_cron 也是 0 → CLAUDE.md 舊寫的
#      「每天 1~3 次在這個 repo 100% 可靠」**被這個反例推翻**(fund_sweep 同樣 1 次/天卻正常)。
#   ⚠️ cron 一行都沒刪 —— 萬一哪天配額鬆了它自己會跑;`workflow_run` 只是多一條進得來的路。
on:
  # ⭐ 跟車:下面這幾支是實測「排程真的進得來」的(⛔ 改它們的名字要同步改這裡)
  workflow_run:
    workflows:
      - "📲 Telegram 警報系統"
      - "⚡ 當沖熱度採礦 (daytrade_probe)"
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '0 0,4,12,16,20 * * 1-5'   # ⚡ V69.8.6 P3-3:原每 4 小時全天全週(週末 12 輪抓不更新的資料);改交易日 5 輪並避開 08:00(daily_miner 08:30 自帶一輪)

permissions:
  contents: write

concurrency:
  group: macro-cron
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # ⛔ 只跟「host 的**排程**那一輪」(同 playbook_scan 已驗證過的做法)——
    #   host 被手動 dispatch / push 觸發時⛔ 不跟,否則一天可能被帶跑好幾次。
    # ⚠️ 這裡**刻意不要求 host 成功** —— 這支採礦跟 host 的產物無關,
    #   host 失敗(例如 runner 配不出來)不該連累它。
    # ⚠️ 手動 dispatch 與原本的 cron 備援不受這個 if 影響(它們的 event 不是 workflow_run)。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'schedule'
    timeout-minutes: 8
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: 📦 安裝相依套件
        run: pip install requests yfinance --quiet

      - name: 🌍 執行總經採礦
        env:
          # 🩹 V69.8.4 P0-6:原本沒傳 token → fetch_tw_vix 永遠 no-token,台指 VIX 恆 null
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          FINMIND_TOKEN:  ${{ secrets.FINMIND_TOKEN }}
          # 🤖 V70.3.0 財經行事曆 Groq 解讀(沒 key 就跳過,不影響其他總經欄位)
          GROQ_API_KEYS:  ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          # 🧠 V71.3.9 財經行事曆改用 Gemini 2.5 Flash 深度判讀(Groq 退居備援)
          #   沒設 GEMINI_API_KEY 也不會壞:_gemini_chat_mm 直接回 None → 自動退回 Groq
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
        run: python macro_miner.py

      - name: 📡 同步 data/macro_risk.json 到 gh-pages
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f data/macro_risk.json ]; then
            echo "❌ macro_risk.json 不存在,跳過"
            exit 0
          fi

          mkdir -p /tmp/macro
          cp data/macro_risk.json /tmp/macro/

          push_with_retry() {
            git fetch origin gh-pages
            git checkout gh-pages
            git reset --hard origin/gh-pages
            mkdir -p data
            cp /tmp/macro/macro_risk.json data/macro_risk.json
            if git diff --quiet -- data/macro_risk.json; then
              echo "無變化,跳過 commit"
              return 0
            fi
            git add data/macro_risk.json
            git commit -m "🌍 macro 4hr sync $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin gh-pages
          }

          for i in 1 2 3; do
            if push_with_retry; then
              echo "✅ macro_risk.json 已同步 (try $i)"
              exit 0
            fi
            echo "⚠️ try $i 失敗,可能被 daily_miner force-push 卡到,重試..."
            sleep $((i*3))
          done

          echo "❌ 連 3 次失敗,放棄(4hr 後 cron 會再試)"
          exit 0
