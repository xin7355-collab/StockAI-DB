name: 🏷️ 概念股採礦(probe)

# ⚙️ 探勘用:手動觸發,跑 concept_miner.py 抓 megatime 概念股 → data/concept_stocks.json
#    先用這支確認網站結構、校正解析;穩定後再併進 daily_miner.yml 常態更新。
on:
  workflow_dispatch:
    inputs:
      probe:
        description: '1=深度探勘結構 / 0=正式抓取'
        required: false
        default: '1'
      deploy:
        description: '1=抓完把 concept_stocks.json 加進 gh-pages(立即上線)'
        required: false
        default: '0'

# 與 deploy_pages / daily_miner deploy 共用 group,避免同時 push gh-pages 撞鎖
concurrency:
  group: gh-pages-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🏷️ 跑概念股採礦
        env:
          CONCEPT_PROBE: ${{ github.event.inputs.probe || '1' }}
        run: python concept_miner.py

      - name: 📋 印出產物摘要
        if: always()
        run: |
          echo "=== concept_stocks.json (前 3000 字) ==="
          head -c 3000 data/concept_stocks.json 2>/dev/null || echo "(無檔案)"
          echo ""
          echo "=== 檔案大小 ==="
          ls -la data/concept_stocks.json 2>/dev/null || echo "(無檔案)"

      - name: ⬆️ 上傳 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: concept_stocks
          path: data/concept_stocks.json
          if-no-files-found: warn

      - name: 🌐 加進 gh-pages(立即上線,additive 不動其他檔;deploy=1 才跑)
        if: ${{ github.event.inputs.deploy == '1' }}
        run: |
          set -e
          [ -f data/concept_stocks.json ] || { echo "無 concept_stocks.json,跳過"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/cs && cp data/concept_stocks.json /tmp/cs/
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || { echo "gh-pages 不存在,略過(等 daily_miner 建立)"; exit 0; }
          mkdir -p data && cp /tmp/cs/concept_stocks.json data/concept_stocks.json
          git add data/concept_stocks.json
          git diff --cached --quiet && { echo "無變更"; exit 0; }
          git commit -m "🏷️ 概念股 concept_stocks.json 更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push origin gh-pages && { echo "✅ push 成功 ($i)"; break; }
            [ "$i" -eq 5 ] && { echo "❌ push 連 5 次失敗"; exit 1; }
            sleep $((i*5)); git fetch origin gh-pages 2>/dev/null || true
            git pull --rebase origin gh-pages 2>/dev/null || true
          done
