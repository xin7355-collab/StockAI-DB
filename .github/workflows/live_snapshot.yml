name: 📸 全市場即時快照 (Shioaji)

# 抓「全上市櫃股票 + 台指期」即時價/漲跌%/量 → data/live_quotes.json
# 供:當沖全市場強勢榜 + 庫存/自選現價基準(免每檔打 Fugle 撞 429)+ 即時台指期
# ⚠️ 需 GitHub Secrets:SHIOAJI_API_KEY、SHIOAJI_SECRET_KEY(同個股期貨那支,已設好)
# 🧪 第一次請「Run workflow」手動觸發看 log,確認抓到 >300 檔再靠 cron。
# ⏱️ 排程:台股盤中(09:00~13:30 = UTC 01:00~05:30)每 5 分鐘一次。
#    GitHub Actions 排程為 best-effort,尖峰可能延遲數分鐘 → 前端會顯「更新 時間」讓你判斷新鮮度。
# 🌅 V73.7.7 加盤前三輪(台北 08:45/08:50/08:55):台指期 08:45 就開盤,現貨要 09:00。
#    ⚠️ 那三輪 `live_snapshot_miner.py` 會自動走**盤前模式** —— 只抓期貨、寫 `live_index.json`,
#    ⛔ **完全不碰 `live_quotes.json`**(盤中快照是當沖頁命脈,不可被盤前的空資料覆蓋)。
on:
  workflow_dispatch:
  schedule:
    - cron: '45,50,55 0 * * 1-5'   # UTC 00:45~00:55(台北 08:45~08:55 盤前,只抓期貨)
    - cron: '*/5 1-4 * * 1-5'      # UTC 01:00~04:55 每 5 分(台北 09:00~12:55)
    - cron: '0,5,10,15,20,25,30 5 * * 1-5'   # UTC 05:00~05:30(台北 13:00~13:30 收盤)

# 🚨 V73.7.9 從共用的 `gh-pages-push` 搬出來,改用自己的 group。
#    真因:GitHub 的 concurrency **每個 group 只留一個 pending run** —— 後面來的會把前面
#    還在排隊的那個直接取消掉。這支每 5 分鐘一發、tick_flow 每 10 分鐘一發,
#    再加上 deploy_pages / daily_miner deploy 也在同一個 group → 盤中約 82 個事件擠一個位子,
#    只要機器排隊超過幾分鐘就整串互相擠掉。
#    實測(2026-08-20):`data/live_quotes.json` **從來沒出現在 gh-pages 上過**,
#    手動觸發同一份程式碼卻 84 秒跑完、2,330 檔 + 台指期全對 → 程式沒問題,是排程被擠掉。
#    ⛔ 而且**全綠、零錯誤訊息**(陷阱 #9),所以撐了很久都沒人發現。
# ⭐ `cancel-in-progress: true` 是刻意的:快照要的是「最新」,舊的還在跑就該砍掉。
# ⚠️ 代價:可能與 deploy_pages / daily_miner 同時 push gh-pages → 靠下面既有的
#    「5 次 retry + fetch/pull --rebase」吸收(那個迴圈本來就是為此而寫)。
#    ⛔ 別為了「避免打架」把它搬回共用 group —— 那正是它產不出東西的原因。
concurrency:
  group: gh-pages-intraday-quotes
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝 shioaji
        run: pip install "shioaji<1.7"   # 📌 1.7.0 移除 login(fetch_contract=) → 釘在 1.6.x 保留既有登入寫法

      - name: 📸 採全市場即時快照
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python3 live_snapshot_miner.py

      # ℹ️ 只 push gh-pages,不進 data 分支(刻意):live_quotes 是「每 5 分鐘重生」的即時快照,
      #    盤中會不斷刷新、盤後前端不讀(isMarketOpen 守門)。daily_miner 下午洗掉它無妨——
      #    下個交易日開盤第一次 cron 就重建。若進 data 分支反而讓備份分支每 5 分鐘 churn 一次,不值得。
      #    (對比 stock_futures_night.json 是隔夜持久資料 → 那支才走雙分支保存。)
      # 🌅 V73.7.7 盤前模式產出的是 live_index.json(只有台指期);盤中是 live_quotes.json(全市場)。
      #    ⭐ 兩者部署到**不同檔名**,⛔ 盤前那輪絕不覆蓋盤中快照。
      - name: 🚀 部署到 gh-pages(盤中:live_quotes.json / 盤前:live_index.json)
        run: |
          SRC=""; DST=""
          if   [ -f live_quotes.json ]; then SRC=live_quotes.json; DST=data/live_quotes.json
          elif [ -f live_index.json  ]; then SRC=live_index.json;  DST=data/live_index.json
          else echo "❌ 沒產出 JSON,略過部署"; exit 1; fi
          echo "📦 部署 $SRC → $DST"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp "$SRC" /tmp/lq.json

          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || { echo "❌ gh-pages 不存在(等 daily_miner 先建)"; exit 1; }

          mkdir -p data
          cp /tmp/lq.json "$DST"
          git add "$DST"
          git diff --cached --quiet && echo "無變更,跳過" || {
            git commit -m "📸 即時快照 $(basename $DST) $(date -u '+%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3 4 5; do
              git push origin gh-pages && { echo "✅ push 成功 ($i)"; break; }
              [ "$i" -eq 5 ] && { echo "❌ push 連 5 次失敗"; exit 1; }
              sleep $((i*5)); git fetch origin gh-pages 2>/dev/null || true; git pull --rebase origin gh-pages 2>/dev/null || true
            done
          }
          echo "✅ $DST 已部署"
