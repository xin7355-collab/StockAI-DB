name: 🔬 法說會簡報下載速度探針 (deck_dl_probe)

# 🔬 V79.6.4 量一次就好:公開資訊觀測站的簡報檔「一條連線多快 / 能不能續傳 / 開幾條連線會不會比較快」
#    10/23 confcall_deck 第 4 輪:檔案路徑每份約 40 KB/s,8 MB 以上的大簡報兩條路都在 240 秒時限內下載不完 → 整份放棄
#    (那一輪 40 分鐘有 18 分鐘花在下載不完的 4 份上,一份都沒讀到)。
#    ⛔ 沙箱連不到 mopsov(代理擋),只能在 GitHub 的機器上量 → 這支只做量測、⛔ 不寫任何檔案、⛔ 不推任何分支。
#    ⛔ 只能手動跑;自己一個 concurrency group(⛔ 不可進 confcall-deck 那組 —— 會被接力的下一棒擠掉)。

on:
  workflow_dispatch:
    inputs:
      files:
        description: '要量的簡報檔名(空白分隔;預設 = 10/23 下載不完的兩份大檔 + 一份小檔)'
        required: false
        default: ''

concurrency:
  group: deck-dl-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 量下載速度
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🔬 一條 vs 多條連線・續傳支援
        env:
          FILES: ${{ inputs.files }}
        run: |
          H=https://mopsov.twse.com.tw
          UA="Mozilla/5.0 confcall_deck/1.0"
          FILES="${FILES:-641420261016M001.pdf 665720261016M002.pdf 233020261015M001.pdf}"
          MB=1048576
          spd () { awk -v b="$1" -v t="$2" 'BEGIN{ if (t>0) printf "%.0f KB/s", b/1024/t; else print "-" }'; }
          for F in $FILES; do
            nas="$H/nas/STR/$F"
            srv="$H/server-java/FileDownLoad?step=9&filePath=/home/html/nas/STR/&functionName=t100sb02_1&fileName=$F"
            echo "════════ $F"
            for R in nas srv; do
              U=$nas; [ "$R" = srv ] && U=$srv
              rm -f /tmp/h.txt /tmp/r.bin
              curl -sS -m 40 -A "$UA" -r 0-1023 -D /tmp/h.txt -o /tmp/r.bin "$U" || echo "  ($R 第一次請求失敗 rc=$?)"
              echo "  ① $R 續傳(Range)測試:$(grep -iE '^HTTP/' /tmp/h.txt 2>/dev/null | tail -1 | tr -d '\r') ・$(grep -iE '^content-range:' /tmp/h.txt 2>/dev/null | tr -d '\r') ・$(grep -iE '^accept-ranges:' /tmp/h.txt 2>/dev/null | tr -d '\r') ・拿到 $(wc -c < /tmp/r.bin 2>/dev/null || echo 0) bytes ・開頭 $(head -c 5 /tmp/r.bin 2>/dev/null | od -An -c | tr -s ' ' | head -1)"
            done
            TOT=$(grep -iE '^content-range:' /tmp/h.txt 2>/dev/null | head -1 | sed -E 's#.*/([0-9]+).*#\1#' | tr -d '\r')
            echo "  檔案大小(Content-Range):${TOT:-不知道}"
            # ② 一條連線 2 MB(位元組 0~2MB)
            o=$(curl -sS -m 150 -A "$UA" -r 0-$((2*MB-1)) -o /tmp/one.bin -w '%{http_code} %{size_download} %{time_total}' "$nas" 2>&1 || true)
            set -- $o; echo "  ② 一條連線 2 MB:HTTP $1 ・$2 bytes ・$3 秒 ・$(spd "$2" "$3")"
            # ③ 四條連線同時各 0.5 MB(位元組 2MB~4MB,⛔ 跟 ② 不同段,避免吃到快取)
            t0=$(date +%s.%N)
            for i in 0 1 2 3; do
              a=$((2*MB + i*MB/2)); b=$((a + MB/2 - 1))
              curl -sS -m 150 -A "$UA" -r $a-$b -o /tmp/p$i.bin -w "%{http_code} %{size_download} %{time_total}\n" "$nas" > /tmp/p$i.txt 2>&1 &
            done
            wait
            t1=$(date +%s.%N)
            el=$(awk -v a="$t0" -v b="$t1" 'BEGIN{printf "%.1f", b-a}')
            sum=0; codes=""
            for i in 0 1 2 3; do set -- $(cat /tmp/p$i.txt); codes="$codes $1"; sum=$((sum + ${2:-0})); done
            echo "  ③ 四條連線同時 2 MB:HTTP$codes ・合計 $sum bytes ・$el 秒 ・合計 $(spd "$sum" "$el")"
            # ④ 兩條連線同時各 1 MB(位元組 4MB~6MB)
            t0=$(date +%s.%N)
            for i in 0 1; do
              a=$((4*MB + i*MB)); b=$((a + MB - 1))
              curl -sS -m 150 -A "$UA" -r $a-$b -o /tmp/q$i.bin -w "%{http_code} %{size_download} %{time_total}\n" "$nas" > /tmp/q$i.txt 2>&1 &
            done
            wait
            t1=$(date +%s.%N)
            el=$(awk -v a="$t0" -v b="$t1" 'BEGIN{printf "%.1f", b-a}')
            sum=0; codes=""
            for i in 0 1; do set -- $(cat /tmp/q$i.txt); codes="$codes $1"; sum=$((sum + ${2:-0})); done
            echo "  ④ 兩條連線同時 2 MB:HTTP$codes ・合計 $sum bytes ・$el 秒 ・合計 $(spd "$sum" "$el")"
            # ⑤ 再一次一條連線 2 MB(位元組 6MB~8MB;看 ② 是不是剛好碰到慢的時候)
            o=$(curl -sS -m 150 -A "$UA" -r $((6*MB))-$((8*MB-1)) -o /tmp/one2.bin -w '%{http_code} %{size_download} %{time_total}' "$nas" 2>&1 || true)
            set -- $o; echo "  ⑤ 一條連線 2 MB(再一次):HTTP $1 ・$2 bytes ・$3 秒 ・$(spd "$2" "$3")"
            for f in /tmp/one.bin /tmp/p0.bin /tmp/q0.bin; do
              [ -s "$f" ] && head -c 200 "$f" | grep -qaE '因為安全性考量|CAN NOT BE ACCESSED' && echo "  🚨 $f 是被擋的網頁"
            done
            sleep 5
          done
          echo "⏭️ 判讀:③④ 的合計速度明顯比 ②⑤ 高(而且 HTTP 都是 206)→ 主機是「每條連線限速」,開幾條連線就快幾倍;差不多 → 是整台機器 / 整條線路慢,開多條沒用"
