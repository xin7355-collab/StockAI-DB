name: 🔎 ETF 持股來源探針 (純診斷)

# 用途：在雲端(有外網)dump ETF 持股候選端點的真實回應，供寫對解析器。
# 純診斷：不部署、不寫 gh-pages/data、不與 daily_miner / deploy_pages 競爭。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'etf_probe.py'
      - '.github/workflows/etf_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: 🔎 跑探針
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
        run: python etf_probe.py
