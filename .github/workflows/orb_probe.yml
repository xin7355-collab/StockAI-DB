name: 🔬 開盤區間突破(ORB)分K回測探針

# 純驗證用:只跑 orb_probe.py,實測「Shioaji api.kbars 能抓多深的歷史 1 分K + ORB 回測勝率有無鑑別度」。
# 不碰 gh-pages / data 分支,零部署風險。push orb_probe.py / 本檔即自動跑;也可 Actions UI 手動 Run。
# 目的:確認 ORB(分K)可行性 → 可行再正式建 orb_miner 滾動回測全清單。
on:
  workflow_dispatch:   # ⚡ V69.8.6 P3-6:改純手動(原 push 觸發每次改檔白跑一輪;ORB 已定案不上,保留手動重驗)

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 ORB 分K 探針
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: 📦 安裝相依套件(Shioaji)
        run: pip install "shioaji<1.7" --quiet   # 📌 同 live_snapshot/tick_flow:1.7.0 移除 login(fetch_contract=) → 釘 1.6.x

      - name: 📂 建 data 目錄
        run: mkdir -p data

      - name: 🔬 執行 ORB 分K 回測探針
        env:
          SHIOAJI_API_KEY: ${{ secrets.SHIOAJI_API_KEY }}
          SHIOAJI_SECRET_KEY: ${{ secrets.SHIOAJI_SECRET_KEY }}
        run: python orb_probe.py || echo "⚠️ 非零退出(仍印出結果)"

      - name: 📤 上傳探針結果 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-probe-result
          path: data/orb_probe_result.json
          if-no-files-found: warn
