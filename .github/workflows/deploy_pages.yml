name: 🚀 部署到 GitHub Pages

on:
  push:
    branches:
      - claude/optimize-html-c20DA
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 部署到 gh-pages 分支
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 建立暫存目錄，複製要部署的檔案
          mkdir -p /tmp/deploy
          cp index.html /tmp/deploy/
          cp sw.js      /tmp/deploy/

          # 切到 gh-pages orphan 分支
          git checkout --orphan gh-pages
          git rm -rf --cached . -q 2>/dev/null || true
          find . -maxdepth 1 -not -name '.git' -not -name '.' | xargs rm -rf 2>/dev/null || true

          # 複製檔案進來
          cp /tmp/deploy/index.html .
          cp /tmp/deploy/sw.js      .

          git add index.html sw.js
          git commit -m "🚀 部署 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin gh-pages --force

          echo "✅ gh-pages 已更新"
