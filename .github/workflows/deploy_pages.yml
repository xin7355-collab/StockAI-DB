name: 🚀 部署到 GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 部署到 gh-pages（只更新 index.html 與 sw.js，保留股票資料）
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 暫存最新的前端檔案
          mkdir -p /tmp/deploy
          cp index.html /tmp/deploy/
          cp sw.js      /tmp/deploy/

          # 切到現有的 gh-pages（保留所有資料，不用 --orphan）
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || {
            # gh-pages 不存在時才建立 orphan
            git checkout --orphan gh-pages
            git rm -rf --cached . -q 2>/dev/null || true
            find . -maxdepth 1 -not -name '.git' -not -name '.' | xargs rm -rf 2>/dev/null || true
          }

          # 只更新前端檔案，資料目錄 data/ 保持不動
          cp /tmp/deploy/index.html .
          cp /tmp/deploy/sw.js      .

          # 🆕 每次部署把 Service Worker 的 CACHE_NAME 注入 commit SHA，
          #     讓 sw.js 內容隨每次部署改變 → 瀏覽器認得新 SW → 自動接管+reload，杜絕使用者卡舊版
          sed -i "s/const CACHE_NAME = '[^']*'/const CACHE_NAME = 'stockai-${GITHUB_SHA::8}'/" sw.js
          echo "SW CACHE_NAME → stockai-${GITHUB_SHA::8}"

          git add index.html sw.js
          git diff --cached --quiet && echo "無變更，跳過" || {
            git commit -m "🚀 前端更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin gh-pages
          }

          echo "✅ gh-pages index.html 已更新（股票資料完整保留）"
