# 🇺🇸 美股 / 美股 ETF / 指數 5 年日線 → data/us_hist.json(V77.7.7)
#
# 為什麼要有這支:repo 正式產物**完全沒有美股逐日價格序列**(macro_cache / macro_risk 全是當天快照,
#   risk_history 只有 59 天)→ 「美股隔夜異常 → 台股」(us_tw_lead_probe.mjs)沒東西可測。
#   沙箱連不到 Yahoo(CONNECT 403),只有 Actions 能用 yfinance → 採礦只能在這裡跑。
#
# ⭐ 觸發 = **只有手動 Run**(V78.2.5 起;⛔ 不開 cron、⛔ 不掛 workflow_run)→ data 分支上那份只在有人按的時候才更新,
#   ⛔ 不是每天自動更新(V82.2.6 更正:CLAUDE.md / 實測總表以前寫「每天自動更新」是錯的;11/13 使用者問「美股日線為什麼停在 10/30」)。
#   要用最新的美股資料做研究 → 先到 Actions 手動 Run 一次(預設從 2009-01-01 抓起)。
#
# ⭐ 為什麼推 data 分支而不是 gh-pages:daily_miner 的 gh-pages 是 orphan force-push,內容全部來自
#   `git archive origin/data` 鋪的底層 + 🛟 撿回 → 進了 data 分支就會自動跟著上 gh-pages,**daily_miner 一行不改**
#   (同 fin_backfill「切片 → 推 data 分支」、tick_flow「也推 data 分支」)。
#
# ⚠️ 不需要任何金鑰。守門在 Python 端:<30 檔 / <1000 天 / asof 落後 >5 天 → 不覆蓋舊檔(exit 0)。
# ⚠️ 驗證⛔ 不可只看 Actions 綠燈(陷阱 #9)→ `git show origin/data:data/us_hist.json | head -c 300`。
name: 🇺🇸 美股日線歷史 (us_hist)

# 🛑 V78.2.5 拿掉跟車(workflow_run),只留手動 Run:它每次都重抓完整 5 年(⛔ 不需要每天累積)、
#   App 不讀它、美股→台股三層實測都沒優勢(V77.7.8);VIX 探針要等下一次空頭才重跑 → 到時手動 Run 一次即可。
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'yfinance period(留空 = 5y)'
        required: false
        default: ''
      start:
        description: '從哪一天抓起(YYYY-MM-DD;有填就不看 years)。預設 2009-01-01 = data 分支上那份的長度(研究探針要用);清空 = 只抓 years'
        required: false
        default: '2009-01-01'
      allow_shrink:
        description: '填 1 才允許新的比 data 分支上那份短(⛔ 平常別填:會把 2009 起的長歷史蓋成 5 年)'
        required: false
        default: ''
      group:
        description: '留空 = 美股日線(data/us_hist.json);world = 各國指數 + 債券 ETF 全部歷史 → world_hist 分支(V82.0.0,大跌研究的樣本外用)'
        required: false
        default: ''

# ⛔ 它推 data 分支(不是 gh-pages)→ 不跟 gh-pages-push 共用鎖;但要防自己疊在一起(手動 + workflow_run 同時來)。
#    執行 3~5 分 ≪ 觸發間隔(一天 1~2 次)→ cancel-in-progress: true 安全(CLAUDE.md 鐵則)。
concurrency:
  group: us-hist-append
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  mine:
    name: 🇺🇸 抓美股日線 → data 分支
    runs-on: ubuntu-latest
    # ⛔ 掛 workflow_run 之後要擋兩種情況(同 kbar5.yml):
    #   ① 採礦失敗 → 那一輪不算數 ② 採礦是被 push 觸發的 → 只跟排程那一輪
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'schedule')
    timeout-minutes: 20
    steps:
      - name: 📥 下載程式碼 (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝 yfinance
        run: pip install --quiet yfinance

      # ⚠️ selftest 跟正式跑寫在同一個 step:selftest 沒過就⛔ 不該去動 data 分支
      # 🌏 V82.0.0 各國指數(⛔ 排程,只能手動派 group=world;⛔ 進 gh-pages —— App 用不到,獨立分支 world_hist)
      - name: 🌏 各國指數 + 債券 ETF 全部歷史(group=world)
        if: github.event.inputs.group == 'world'
        env:
          OUT: /tmp/world_hist.json.gz
        run: |
          set -e
          python3 scripts/world_hist_miner.py --selftest
          python3 scripts/world_hist_miner.py || { echo "⛔ 守門沒過 → 這輪不推(上一份保留)"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard -q 2>/dev/null || true
          git clean -fdq 2>/dev/null || true
          if git fetch --depth=1 origin "+refs/heads/world_hist:refs/remotes/origin/world_hist" 2>/dev/null; then
            git checkout -f -B world_hist origin/world_hist
          else
            git checkout -q --orphan world_hist
            git rm -rqf . 2>/dev/null || true
            git clean -fdq 2>/dev/null || true
          fi
          cp /tmp/world_hist.json.gz world_hist.json.gz
          git add -f world_hist.json.gz
          if git diff --cached --quiet; then echo "ℹ️ 跟分支上一樣"; exit 0; fi
          git commit -q -m "🌏 各國指數全部歷史 $(date -u '+%Y-%m-%d %H:%M UTC')" -- world_hist.json.gz
          for i in 1 2 3 4 5; do
            git push origin world_hist && { echo "✅ world_hist 分支已更新(第 $i 次)"; exit 0; }
            sleep $((i * 3))
          done
          echo "❌ push 連 5 次失敗"; exit 1

      - name: 🇺🇸 selftest → 抓日線(預設 2009-01-01 起)
        if: github.event.inputs.group != 'world'
        env:
          # 🔧 排程/workflow_run 觸發時 inputs.* 是**空字串**不是不存在 → Python 端一律 `or 預設`(check_env_default.py)
          YEARS: ${{ github.event.inputs.years }}
          START: ${{ github.event.inputs.start }}
          ALLOW_SHRINK: ${{ github.event.inputs.allow_shrink }}
          OUT: /tmp/us_hist.json
          PREV: /tmp/us_prev.json
        run: |
          python3 scripts/us_hist_miner.py --selftest
          # 🛡️ V82.2.6 上一份(data 分支)拿出來給縮短守門比:新的比它短 → 不覆蓋。拿不到 → 刪掉(⛔ 留 0 bytes,陷阱 #18/#20)
          if git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data" 2>/dev/null \
             && git show origin/data:data/us_hist.json > /tmp/us_prev.json 2>/dev/null && [ -s /tmp/us_prev.json ]; then
            echo "🧾 上一份 $(wc -c < /tmp/us_prev.json) bytes"
          else
            rm -f /tmp/us_prev.json; echo "ℹ️ data 分支上還沒有 us_hist.json(或拿不到)→ 不比長短"
          fi
          python3 scripts/us_hist_miner.py
          [ -s /tmp/us_hist.json ] || { echo "⛔ 守門沒過或抓不到 → 這輪不推(舊檔保留)"; echo "SKIP=1" >> "$GITHUB_ENV"; }

      - name: 🚀 推到 data 分支(data/us_hist.json)
        if: env.SKIP != '1' && github.event.inputs.group != 'world'
        run: |
          set -e
          python3 - <<'PY'
          import json; d = json.load(open('/tmp/us_hist.json'))
          m = d['meta']; print(f"📊 {m['n_syms']} 檔 ・{m['n_days']} 天 ・asof {d['asof']} ・errors {len(d['errors'])}")
          assert m['n_syms'] >= 30 and m['n_days'] >= 1000, '守門沒過卻寫了檔?'
          PY
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git reset --hard -q 2>/dev/null || true
          git clean -fdq 2>/dev/null || true
          git fetch origin "+refs/heads/data:refs/remotes/origin/data"
          git checkout -f -B data origin/data
          mkdir -p data
          cp /tmp/us_hist.json data/us_hist.json
          git add -f data/us_hist.json
          if git diff --cached --quiet; then
            echo "ℹ️ data/us_hist.json 跟分支上一樣,沒東西可推"
          else
            git commit -q -m "🇺🇸 美股日線歷史 $(date -u '+%Y-%m-%d %H:%M UTC')" -- data/us_hist.json
            pushed=0
            # ⛔ 這個 retry 迴圈不可拿掉(唯一擋「同時 push」的東西;中間 pull --rebase)
            for i in 1 2 3 4 5; do
              git push origin data && { pushed=1; echo "✅ data/us_hist.json 已推上 data 分支 (第 $i 次)"; break; }
              sleep $((i * 3))
              git pull --rebase origin data 2>/dev/null || true
            done
            [ "$pushed" -eq 1 ] || { echo "❌ push 連 5 次失敗"; exit 1; }
          fi
          echo "📦 下一輪 daily_miner 部署會帶進 gh-pages;探針在沙箱用 git show origin/data:data/us_hist.json 讀"
