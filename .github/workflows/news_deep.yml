name: 📚 新聞歷史回補 + 每天續挖 (news_deep)

# 📚 V80.1.3 鉅亨「台股新聞」分類(2015 起)→ 獨立 orphan 分支 news_deep(⛔ 不進 data / gh-pages,陷阱 #41;只增不減)
#   使用者 10/31:「消息面的新聞目前抓法沒有很完整…補齊後再做多因子回測」。
#   news_src_probe 實測(mode=hist / fields):分類 + 日期區間 2015 起每週 350~900 則、一頁 30 則;2021 起大多帶台股代號,
#   2015 那批沒帶(研究時再用股名比對);個股頁只回得到 2 個月、Google 新聞越舊越少 → ⛔ 不拿來回補。
#
# 誰來觸發:
#   ① 手動(回補):由新往舊補到 from(預設 2013-01),一棒最多 max_min 分;時間用完自己接力(最多 20 棒)
#   ② 每天:跟在 daily_miner 那一輪後面(workflow_run,⛔ 不新開 cron —— 排程配額不夠,CLAUDE.md V73.9.0 / V75.2.0),
#      只做 20 分:最近還沒定案的週 + 剩下的回補;回補還沒做完 → 自己派一棒長的接力
# ⛔ 不用任何金鑰、不叫 AI;每次請求間隔 1 秒 + 指數退避(連 4 次失敗就收工)
on:
  workflow_run:
    workflows: ["🤖 每日籌碼採礦機 (平行宇宙版)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      from:
        description: '最早補到哪個月(YYYY-MM;由新往舊補)'
        required: false
        default: '2013-01'
      max_min:
        description: '這一棒最多幾分鐘(job 上限 355)'
        required: false
        default: '330'
      chain:
        description: '(內部用)第幾棒接力'
        required: false
        default: '0'

permissions:
  contents: write
  actions: write                # 接力用(gh workflow run)

concurrency:
  # ⛔ 不可跟別人共用 group(V73.7.9);長工作 ⛔ 不可被第二次觸發砍掉
  group: news-deep
  cancel-in-progress: false

jobs:
  deep:
    name: 📚 鉅亨台股新聞 → news_deep
    runs-on: ubuntu-latest
    # ⛔ 掛 workflow_run 之後:採礦失敗那輪不算;push 觸發的那幾輪(改 miner.py)不跟
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'push')
    timeout-minutes: 355
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 安裝相依
        run: pip install requests

      - name: 🧪 selftest(⛔ 沒過不開工)
        run: python3 scripts/news_deep.py --selftest

      # ⚠️ V49.4 教訓:還原用 git archive,⛔ 不要 git checkout origin/x -- dir(會弄髒 index)
      - name: 📂 還原已抓的
        run: |
          mkdir -p news_deep
          if git fetch --depth=1 origin news_deep 2>/dev/null; then
            git archive FETCH_HEAD news_deep | tar -x || true
          fi
          echo "已抓:$(find news_deep -name '*.json.gz' | wc -l) 個月"

      - name: 📚 回補 / 續挖
        id: run
        env:
          PYTHONUNBUFFERED: '1'
          FROM: ${{ github.event.inputs.from }}
          # 每天那輪(workflow_run)只做 20 分;手動照輸入(空白 = 330)
          MAX_MIN: ${{ github.event_name == 'workflow_run' && '20' || github.event.inputs.max_min }}
          OUT_DIR: news_deep
        run: python3 scripts/news_deep.py

      # ⚠️ 順序:先把 news_deep/ 搬到 /tmp,切完分支再搬回來(⛔ 不然 checkout 會蓋掉整輪的結果)
      - name: 🚀 推到 news_deep 分支
        if: always() && steps.run.outputs.push == '1'
        run: |
          set -e
          n=$(find news_deep -name '*.json.gz' 2>/dev/null | wc -l)
          echo "要推 $n 個月"
          [ "$n" -gt 0 ] || { echo "一個月都沒有 → 不推"; exit 0; }
          rm -rf /tmp/ndeep && mkdir -p /tmp/ndeep && cp -a news_deep/. /tmp/ndeep/
          git config user.name  "StockAI Bot"
          git config user.email "bot@users.noreply.github.com"
          git reset --hard -q && git clean -fdq
          if git fetch --depth=1 origin news_deep 2>/dev/null; then
            git checkout -f -B news_deep FETCH_HEAD
            old=$(find news_deep -name '*.json.gz' | wc -l)
          else
            git checkout -q --orphan news_deep
            git rm -rq --cached . 2>/dev/null || true
            git clean -fdq
            old=0
          fi
          # 🚧 只增不減:這一輪的月份數比分支上少 → 有東西不對,⛔ 不推
          if [ "$n" -lt "$old" ]; then echo "::error::這一輪 $n 個月 < 分支上 $old 個月 → 不推"; exit 1; fi
          rm -rf news_deep && mkdir -p news_deep && cp -a /tmp/ndeep/. news_deep/
          git add -f news_deep
          if git diff --cached --quiet; then echo "✅ 沒有新東西 → 不 commit"; exit 0; fi
          git commit -q -m "📚 鉅亨台股新聞 $n 個月 $(date -u +%Y-%m-%d)"
          pushed=0
          # ⛔ 這個 retry 迴圈不可拿掉
          for i in 1 2 3 4 5; do
            git push origin news_deep && { pushed=1; echo "✅ 已推上 news_deep(第 $i 次)"; break; }
            sleep $((i * 3))
            git pull --rebase origin news_deep 2>/dev/null || true
          done
          [ "$pushed" -eq 1 ] || { echo "::error::push 連 5 次失敗"; exit 1; }

      # 🔁 只有「時間用完、還有積壓」才接力(被擋 / 壞檔 ⛔ 不接力)
      - name: 🔁 接力
        if: steps.run.outputs.more == '1' && steps.run.outputs.reason == 'time' && steps.run.outputs.push == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ github.event.inputs.chain }}
          FROM_M: ${{ github.event.inputs.from }}
        run: |
          C=$(( ${CHAIN:-0} + 1 ))
          if [ "$C" -gt 20 ]; then echo "⛔ 已經接力 20 棒 → 停(防無限迴圈)"; exit 0; fi
          gh workflow run news_deep.yml --ref main -f from="${FROM_M:-2013-01}" -f chain="$C" -f max_min=330
          echo "🔁 已觸發第 $C 棒"
