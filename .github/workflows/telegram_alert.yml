name: 📲 Telegram 警報系統

# 戰區三:讀 origin/data 分支上的最新採礦 JSON,推 Telegram
#
# ⛔ V21.4 已停用自動排程(使用者決策):此套只發「全市場籠統摘要」且讀不到個人庫存、
#    時間用 UTC 判斷有 bug。個人化推播(庫存 -5%/5MA、盤前方向、獵殺買點)全部改由
#    Cloudflare Worker(cloud-worker/worker.js)負責 — 它能透過 /sync 讀到你的自選/庫存/監控。
#    保留 workflow_dispatch 供必要時手動觸發(不會再自動發、不再與 Worker 重複)。
#
# 必要 secrets:
#   TELEGRAM_BOT_TOKEN  - @BotFather 建 bot 拿 token
#   TELEGRAM_CHAT_ID    - @userinfobot 找到您的 chat ID

on:
  # schedule: 已移除自動排程(改用 Cloudflare Worker);如需恢復,取消下方註解即可
  #   - cron: '30 0 * * 1-5'   # 08:30 盤前
  #   - cron: '0 6 * * 1-5'    # 14:00 盤後
  #   - cron: '*/30 1-5 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '模式(summary=摘要 / watch=監聽)'
        required: false
        default: 'summary'
        type: choice
        options:
          - summary
          - watch

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 📥 拉 data 分支最新 JSON snapshot
        run: |
          git fetch origin data --depth=1 2>&1 || echo "⚠️ data 分支拉取失敗"
          git checkout FETCH_HEAD -- data/ 2>&1 || echo "⚠️ data/ 取出失敗"
          ls -la data/*.json 2>&1 | head -5 || echo "(無 JSON 檔)"

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚨 跑警報腳本
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 判斷模式:手動 dispatch 用 input;cron 用時間判斷
          ALERT_MODE: ${{ github.event.inputs.mode || (github.event.schedule == '30 0 * * 1-5' && 'summary' || (github.event.schedule == '0 6 * * 1-5' && 'summary' || 'watch')) }}
        run: python alert_system.py
