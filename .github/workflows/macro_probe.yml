name: 🔬 總經採礦驗證探針 (macro probe)

# 純驗證用：只跑 macro_miner.py，把 data/macro_risk.json 印到 log + 上傳 artifact。
# 不碰 gh-pages / data 分支，零部署風險。供快速確認每一欄是否真的抓到值（~2 分鐘）。
# push macro_miner.py / 本檔即自動跑（免 dispatch 權限），方便快速迭代收斂 TAIFEX schema。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "macro_miner.py"
      - ".github/workflows/macro_probe.yml"

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 macro 探針
    runs-on: ubuntu-latest
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: 📦 安裝相依套件
        run: pip install requests yfinance --quiet

      - name: 🌐 執行總經採礦
        run: python macro_miner.py || echo "⚠️ macro_miner.py 非零退出（仍印出結果）"

      - name: 🔭 TAIFEX OpenAPI 探索（找三大法人端點 + 真實欄位名）
        if: always()
        run: |
          python - <<'PY'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)", "Accept": "application/json"}
          sw = None
          for u in ["https://openapi.taifex.com.tw/swagger/v1/swagger.json",
                    "https://openapi.taifex.com.tw/swagger/docs/v1",
                    "https://openapi.taifex.com.tw/v1/swagger.json",
                    "https://openapi.taifex.com.tw/swagger.json"]:
              try:
                  r = requests.get(u, timeout=25, headers=H)
                  print("SWAGGER", u, r.status_code, len(r.text))
                  if r.status_code == 200 and r.text.lstrip().startswith("{"):
                      sw = r.json(); print("USING", u); break
              except Exception as e:
                  print("SWAGGER ERR", u, str(e)[:80])
          cands = []
          if sw:
              paths = list((sw.get("paths") or {}).keys())
              print("TOTAL PATHS", len(paths))
              for p in paths:
                  pl = p.lower()
                  if any(k in pl for k in ["institutional", "trader", "major", "contract"]):
                      print("PATH", p)
                      cands.append(p.strip("/").split("/")[-1])
          else:
              print("NO SWAGGER → 用硬猜候選")
              cands = ["MarketDataOfMajorInstitutionalTradersDetailsOfAllContractsByDate",
                       "MarketDataOfMajorInstitutionalTradersDetailsofAllContractsByDate",
                       "MarketDataOfMajorInstitutionalTradersDetailsOfAllContracts"]
          seen = set()
          for c in cands:
              if c in seen:
                  continue
              seen.add(c)
              try:
                  r = requests.get("https://openapi.taifex.com.tw/v1/" + c, timeout=25, headers=H)
                  ok = r.status_code == 200 and r.text.lstrip().startswith("[")
                  print("EP", c, r.status_code, "json-list" if ok else r.text[:50])
                  if ok:
                      d = r.json()
                      if d:
                          print("  KEYS", list(d[0].keys()))
                          for row in d[:400]:
                              s = str(row)
                              if ("外資" in s) or ("臺股期貨" in s) or ("小型臺指" in s):
                                  print("  SAMPLE", json.dumps(row, ensure_ascii=False)[:500]); break
              except Exception as e:
                  print("EP ERR", c, str(e)[:80])
          PY

      - name: 🔎 印出 macro_risk.json（驗證每一欄）
        if: always()
        run: |
          echo "================ data/macro_risk.json ================"
          cat data/macro_risk.json || echo "❌ 檔案不存在"
          echo "======================================================"

      - name: 📤 上傳 macro_risk.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-risk-probe
          path: data/macro_risk.json
          if-no-files-found: warn
