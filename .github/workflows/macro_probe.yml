name: 🔬 總經採礦驗證探針 (macro probe)

# 純驗證用：只跑 macro_miner.py，把 data/macro_risk.json 印到 log + 上傳 artifact。
# 不碰 gh-pages / data 分支，零部署風險。供快速確認每一欄是否真的抓到值（~2 分鐘）。
# push macro_miner.py / 本檔即自動跑（免 dispatch 權限），方便快速迭代收斂 TAIFEX schema。
on:
  workflow_dispatch:   # ⚡ V69.8.6 P3-6:改純手動(原每次 push macro_miner.py 就對十幾個外部 API 打一輪完整採礦)
    inputs:
      which:
        description: '跑哪一個'
        type: choice
        default: taifex
        options:
          - taifex   # 📐 只跑台指期順逆價差探針(~15 秒,只讀 TAIFEX OpenAPI)
          - macro    # 🌐 完整總經採礦(~2 分,打十幾個外部 API)
          - overseas # 🌏 台股 vs 美股/日股/韓股 大盤層級對照(~1 分,只讀 Yahoo/stooq)
          - both
          - twse_margin # 💳 V79.6.6 上市融資融券(證交所帶日期那份)真實格式 + 新解析收不收(~1 分,只讀證交所)
          - index_rebal # 🔎 V80.1.7 臺灣 50 / MSCI 成分股調整的歷史公告去哪裡拿(~2 分,只讀官方首頁往下一層)
          - mops_insider # 🔎 V80.1.7 公開資訊觀測站 申報轉讓 / 董監質押 有沒有歷史(~3 分,只讀 MOPS)
          - trump_src # 🗽 V80.2.1 川普發文來源:CNN 存檔 CSV + trumpstruth RSS 的真實格式 / 大小 / 時區 / 304(~2 分,只讀)
          - us_cycle # 🇺🇸 V81.0.2 標普 500 1928 起:大跌是不是幾年一次(研究,~1 分,只讀 Yahoo、只印 log)

permissions:
  contents: read

jobs:
  probe:
    name: 🔬 macro 探針
    runs-on: ubuntu-latest
    timeout-minutes: 45   # ⏱️ V78.5.6 卡住最多跑這麼久(預設 6 小時會燒光分鐘數)
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4.2.2

      - name: 🐍 設定 Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: 📦 安裝相依套件
        run: pip install requests yfinance --quiet

      # 📐 V73.7.7 台指期順逆價差探針 —— 查「期貨那條腿的日期為什麼落後」。
      #    只讀、不寫任何產物;含對照組(已知會通的端點)分辨「機器被擋」與「端點改名」。
      - name: 📐 台指期順逆價差探針
        if: ${{ inputs.which == 'taifex' || inputs.which == 'both' }}
        run: python3 scripts/taifex_probe.py

      # 🌏 V74.6.9 台股 vs 美日韓大盤層級對照 —— 沙箱連不到 Yahoo/stooq,只能在這裡跑。
      #   ⛔ 只讀、只印:不寫檔、不碰任何分支、不需要任何機密。
      #   ⚠️ 它問的**不是**「同一套打法在美日韓的個股上」(本站沒有那些市場的個股資料),
      #      而是大盤層級的行為:大跌頻率 / V 型反彈 / 同期相關 vs 隔天相關。
      - name: 🌏 台股 vs 美日韓對照探針
        if: ${{ inputs.which == 'overseas' || inputs.which == 'both' }}
        run: python3 scripts/overseas_probe.py

      # 💳 V79.6.6 上市融資融券格式探針 —— 沙箱連不到證交所,新的解析(miner._twse_margin_parse)只能在這裡用真實回應驗。
      #   ⛔ 只讀、只印:不寫檔、不碰任何分支、不需要任何機密;一天都解不出來(而證交所有回)→ 紅燈
      - name: 💳 上市融資融券(證交所帶日期那份)格式探針
        if: ${{ inputs.which == 'twse_margin' }}
        run: python3 scripts/twse_margin_probe.py

      # 🔎 V80.1.7 「早知道先機」研究的資料探路(計畫 B3 / B4)—— 沙箱連不到這些網站,只能在這裡跑。
      #   ⛔ 只讀、只印:不寫檔、不碰任何分支、不需要任何機密;⛔ 猜 API 網址(陷阱 #23:只從官方首頁往下列出真的有的連結)
      - name: 🔎 臺灣 50 / MSCI 成分調整公告來源探路
        if: ${{ inputs.which == 'index_rebal' }}
        run: |
          python3 scripts/index_rebal_src_probe.py --selftest
          python3 scripts/index_rebal_src_probe.py

      - name: 🔎 公開資訊觀測站 申報轉讓 / 董監質押 探路
        if: ${{ inputs.which == 'mops_insider' }}
        run: |
          python3 scripts/insider_src_probe.py --selftest
          python3 scripts/insider_src_probe.py

      # 🗽 V80.2.1 川普動向一格(評估紀錄 53)的資料來源探路 —— 沙箱連不到 CNN / trumpstruth,只能在這裡看真實格式。
      #   ⛔ 只讀、只印:不寫檔、不碰任何分支、不需要任何機密;⛔ 偽裝瀏覽器 / 登入 / 繞 Cloudflare(lib_http.Gate 被擋就停)
      #   兩個來源都抓不到 → 紅燈(= 沒驗到)
      - name: 🗽 川普發文來源探路(CNN 存檔 + RSS)
        if: ${{ inputs.which == 'trump_src' }}
        run: |
          python3 lib_trump.py --selftest
          python3 scripts/trump_src_probe.py --selftest
          python3 scripts/trump_src_probe.py

      # 🇺🇸 V81.0.2 研究:台股只有 26 年 → 拿美股近百年同一套切段方法再驗「大跌有沒有週期」
      #   ⛔ 只讀 Yahoo、只印 log、不寫檔、不碰任何分支;抓不到 → 紅燈(= 沒驗到)
      - name: 🇺🇸 標普 500 大跌週期(1928 起)
        if: ${{ inputs.which == 'us_cycle' }}
        run: |
          python3 scripts/us_cycle_probe.py --selftest
          python3 scripts/us_cycle_probe.py

      - name: 🌐 執行總經採礦
        if: ${{ inputs.which == 'macro' || inputs.which == 'both' }}
        # 🐛 V71.5.3 補上機密 —— 這支的用途是「純驗證,把每一欄印出來查」,
        #   但原本一把 key 都沒給,於是 fetch_tw_vix 一律回 'no-token'、行事曆 AI 一律跳過
        #   → 探針永遠驗不出真正的問題(台指 VIX 到底是資料集改名還是沒 token,查不出來)。
        #   探針要能重現正式環境才有意義,env 對齊 macro_cron.yml。
        env:
          FINMIND_TOKENS:  ${{ secrets.FINMIND_TOKENS }}
          FINMIND_TOKEN:   ${{ secrets.FINMIND_TOKEN }}
          GROQ_API_KEYS:   ${{ secrets.GROQ_API_KEYS }}
          GROQ_API_KEY:    ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY:  ${{ secrets.GEMINI_API_KEY }}
        run: python macro_miner.py || echo "⚠️ macro_miner.py 非零退出（仍印出結果）"

      - name: 🔎 印出 macro_risk.json（驗證每一欄）
        # ⚠️ always() 是刻意的(採礦失敗也要看得到檔);但 taifex-only 模式根本不產這個檔 → 跳過
        if: ${{ always() && (inputs.which == 'macro' || inputs.which == 'both') }}
        run: |
          echo "================ data/macro_risk.json ================"
          cat data/macro_risk.json || echo "❌ 檔案不存在"
          echo "======================================================"

      - name: 📤 上傳 macro_risk.json artifact
        if: ${{ always() && (inputs.which == 'macro' || inputs.which == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: macro-risk-probe
          path: data/macro_risk.json
          if-no-files-found: warn
