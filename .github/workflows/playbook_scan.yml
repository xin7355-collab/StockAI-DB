name: 🎯 明日作戰清單 (playbook_scan)

# 🎯 每晚採礦完之後跑一次:全市場算「**這一檔自己**在**這一招**上是不是真的會賺」,
#    並把「明天漲過多少就觸發」算出來,寫成 data/playbook_edge.json。
#
# ⛔ 為什麼要獨立一支 workflow(⛔ 不併進 daily_miner):
#    它要跑 2,300+ 檔的逐檔回測(實測 25 檔 13 秒 → 全市場約 20-25 分),
#    併進 daily_miner 會把那條已經 30-60 分的關鍵路徑再拉長,而且它失敗不該擋部署。
#
# 🕐 排程:11:00 UTC = 台北 19:00(週一~五)。
#    daily_miner 是 08:30 UTC 開跑、30-60 分跑完 → 這裡留 1.5 小時以上的餘裕,
#    確保讀到的是**今天收盤後**的 data/*.json。
#
# 📌 產物保留:先推 gh-pages(前端立即讀得到),再推 data 分支
#    → 明天 daily_miner deploy 的 `git archive origin/data` 鋪底層時會自動保留,
#      不會被 orphan force-push 洗掉(同 fund_sweep.py 的做法)。

on:
  schedule:
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    inputs:
      max_syms:
        description: '最多掃幾檔(預設全市場;想快速驗證可填 200)'
        required: false
        default: '99999'

# 與 deploy_pages.yml / daily_miner deploy / fund_sweep 共用,避免同時 push gh-pages 打架
concurrency:
  group: gh-pages-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    name: 🎯 全市場打法掃描
    runs-on: ubuntu-latest
    timeout-minutes: 75   # 掃描 ~25 分 + 還原資料 ~5 分 + 安裝 ~3 分,給足餘裕
    steps:
      - name: 📥 下載程式碼 (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📂 還原全市場 OHLCV (origin/data → data/)
        run: |
          git fetch origin data 2>/dev/null || { echo "❌ 沒有 data 分支,無法掃描"; exit 1; }
          git checkout origin/data -- data/ 2>/dev/null || { echo "❌ 還原 data/ 失敗"; exit 1; }
          # ⚠️ checkout 會把檔案 stage 進 index → 先 reset 讓工作區乾淨(V49.4 教訓),檔案本身留著
          git reset -q
          N=$(ls data/*.json 2>/dev/null | wc -l)
          echo "還原 data/*.json:$N 檔"
          [ "$N" -lt 500 ] && { echo "❌ 只有 $N 檔,資料不完整 → 不掃(免得產出殘缺清單)"; exit 1; } || true

      - name: 🌐 安裝 playwright + chromium
        run: |
          npm i -D playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: 🎯 掃描 (playbook_scan)
        id: scan
        env:
          MIN_N: '8'      # 這檔在這招打過幾次才算數(= portfolio_backtest 實測最好那組)
          CAP: '300'
          NEAR: '6'
        run: |
          set +e
          node scripts/playbook_scan.mjs "${{ github.event.inputs.max_syms || '99999' }}"
          rc=$?
          echo "scan_rc=$rc" >> "$GITHUB_OUTPUT"
          # ⛔ 掃描器自己有空過守門(掃到 0 檔 / 一筆候選都沒有 → exit 1 且不寫檔)
          [ "$rc" -ne 0 ] && echo "⚠️ 掃描 rc=$rc → 不部署,保留線上舊檔"
          exit 0

      - name: 🚀 部署 playbook_edge.json 到 gh-pages + data
        if: steps.scan.outputs.scan_rc == '0'
        run: |
          set -e
          [ -s data/playbook_edge.json ] || { echo "❌ 找不到 data/playbook_edge.json,跳過部署"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ 在 main 是 gitignore 的未追蹤檔 → 切分支前要清乾淨,先存到 /tmp
          cp data/playbook_edge.json /tmp/playbook_edge.json

          deploy_branch () {
            local BR="$1"
            git reset --hard -q 2>/dev/null || true
            git clean -fdxq 2>/dev/null || true
            git fetch origin "$BR" 2>/dev/null || true
            # ⚠️ 用 -B + origin/$BR 明確指定:避開「data 既是資料夾又是分支名」的 git 歧義 fatal
            git checkout -f -B "$BR" "origin/$BR" 2>/dev/null || { echo "⚠️ 無 $BR 分支,跳過"; return 0; }
            mkdir -p data
            cp /tmp/playbook_edge.json data/playbook_edge.json
            git add -f data/playbook_edge.json
            if git diff --cached --quiet; then echo "ℹ️ $BR 無變更"; return 0; fi
            git commit -q -m "🎯 明日作戰清單 playbook_edge.json $(date -u '+%Y-%m-%d %H:%M UTC')" -- data/playbook_edge.json
            for i in 1 2 3 4 5; do
              if git push origin "$BR"; then echo "✅ $BR push 成功 (attempt $i)"; return 0; fi
              [ "$i" -eq 5 ] && { echo "❌ $BR push 連 5 次失敗"; return 1; }
              echo "⚠️ $BR push attempt $i 失敗,sleep $((i*5))s 重試…"; sleep $((i*5))
              git fetch origin "$BR" 2>/dev/null || true
              git reset --hard -q "origin/$BR" 2>/dev/null || true
              cp /tmp/playbook_edge.json data/playbook_edge.json
              git add -f data/playbook_edge.json
              git commit -q -m "🎯 明日作戰清單 playbook_edge.json $(date -u '+%Y-%m-%d %H:%M UTC')" -- data/playbook_edge.json 2>/dev/null || true
            done
          }

          deploy_branch gh-pages
          deploy_branch data
          echo "✅ 明日作戰清單已部署"
