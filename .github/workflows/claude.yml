name: 🤖 Claude Code (claude)

# 在 issue / PR 留言(或 issue 標題/內文)打 @claude → Claude 自動實作/修正/開 PR。
# ⚠️ 需先到 GitHub → Settings → Secrets and variables → Actions → New repository secret
#    新增 ANTHROPIC_API_KEY(值 = 你的 Anthropic API 金鑰);或改用 CLAUDE_CODE_OAUTH_TOKEN。
#    金鑰只存在 Secrets(不進程式碼、不公開),安全。
# 💡 if 條件只在留言含「@claude」時才跑 → 一般留言不觸發,省 Actions 額度。
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🤖 執行 Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
