name: 🧪 分析師內容來源探針 (analyst probe)

# ⛔ **只讀不寫**:不產 data/、不部署、不碰 gh-pages。純粹拿情報。
# 🎯 為什麼要有它(2026-08-07 教訓):「分析師焦點」改了 8 版都是
#    「改採礦機 → 等 workflow → 看輸出 → 再改」,每輪 10 分鐘只驗一個假設。
#    ⭐ 照 CLAUDE.md 的「探針先行」鐵則,一次把所有候選路徑跑完再決定。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 🧪 一次試完所有內容來源
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests --quiet
      - name: 🧪 跑探針
        run: python analyst_probe.py
