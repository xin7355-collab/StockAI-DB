name: 🏦 法人/融資券 歷史回補

# 🚨 為什麼要這支:`data/{sym}.json` 的 `foreign_net` 只回溯到 2026/04(約 60 個交易日),
#    害至少 5 條功能長期卡在「樣本不足以回測」。
#    ⭐ 但那不是資料源的限制 —— 探針實測 FinMind 一檔一次呼叫就給 **2015 年起、2,827 個交易日**。
#
# 💾 只寫 `data/*.json` → 推 **data 分支**。
#    ⭐ 不推 gh-pages:`miner.py::seed_db_from_json` 每天會把 JSON 讀回 SQLite
#       (已確認它帶 foreign_net/trust_net/dealer_net/margin_balance/short_balance),
#       再 export 回 JSON 並部署 → 隔天自動出現在前端。
#    ⛔ 這也避免跟 daily_miner 的 gh-pages force-push 打架。
#
# ⛔ 只能手動觸發。可分批跑(LIMIT),重跑會自己跳過已補滿的檔。
#
# 🗄️ V79.3.6 mode=deep:2012~2023-06 每檔法人(外資/投信/自營,單位:股)→ **獨立分支 inst_deep**
#    (inst_deep/{代號}.json.gz,欄位式 {d,f,t,dl})。⛔ 不碰 data/*.json、⛔ 不進 data / gh-pages(避開陷阱 #41)。
#    母體 = klines_deep 分支的 4 碼個股(含已下市)∪ data 分支的 4 碼個股;已經有的檔跳過 → 可以分好幾輪跑完。
#    推之前要過對表(跟 data/*.json 重疊的 2023-06 那段外資一致率 ≥90%),沒過 → ⛔ 不推。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'fill = 補 data/*.json 缺的法人/融資券(原本的做法)・deep = 2012~2023-06 個股法人 → inst_deep 分支'
        required: false
        default: 'fill'
      limit:
        description: '這一輪最多補幾檔(想先小量驗證可填 30;全市場填 99999)'
        required: false
        default: '99999'
      max_min:
        description: '時間預算(分鐘,GitHub job 上限 360)'
        required: false
        default: '300'

# 跟 daily_miner 錯開:同時跑會兩邊都在改 data/*.json
concurrency:
  group: data-branch-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🐍 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚠️ V49.4 教訓:還原資料用 `git show origin/data:檔 > 檔`,
      #    ⛔ 不要 `git checkout origin/data -- data/`(會把整批 stage 進 index 弄髒工作區)
      - name: 📂 從 data 分支還原全市場 JSON
        run: |
          set -e
          git fetch --depth=1 origin data
          mkdir -p data
          git archive origin/data data | tar -x
          n=$(ls data/*.json 2>/dev/null | wc -l)
          echo "還原了 $n 個 data/*.json"
          # 🚧 空過守門:沒還原到就別跑(不然會用空目錄跑完然後回報「成功」)
          if [ "$n" -lt 500 ]; then echo "::error::只還原到 $n 檔,data 分支可能有問題 → 中止"; exit 1; fi

      - name: 🏦 回補法人 / 融資券
        if: github.event.inputs.mode != 'deep'
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          LIMIT: ${{ github.event.inputs.limit }}
          MAX_MIN: ${{ github.event.inputs.max_min }}
        run: python3 inst_backfill.py

      - name: 📊 回補後的實際深度(⛔ 不只看綠燈,要確認真的變深了)
        if: github.event.inputs.mode != 'deep'
        run: |
          python3 - <<'PY'
          import json, glob, statistics
          nz = []
          for f in sorted(glob.glob('data/*.json'))[:400]:
              try: rows = json.load(open(f))
              except Exception: continue
              if not isinstance(rows, list) or len(rows) < 60: continue
              nz.append(sum(1 for r in rows if r.get('foreign_net')))
          if nz:
              print(f"抽驗 {len(nz)} 檔:foreign_net 非零天數 中位 {int(statistics.median(nz))} ・最大 {max(nz)} ・最小 {min(nz)}")
              print("⭐ 回補前中位數是 28 天 —— 沒有明顯變大就代表這一輪其實沒補到")
          else:
              print("⚠️ 抽不到任何檔案")
          PY

      # ⚠️ 順序很重要:`git checkout` 會蓋掉工作目錄的 data/ →
      #    ⛔ 一定要**先把回補結果搬到 /tmp**,切完分支再搬回來,否則整輪白做。
      - name: 💾 推回 data 分支
        if: github.event.inputs.mode != 'deep'
        run: |
          set -e
          rm -rf /tmp/bf && mkdir -p /tmp/bf
          cp -a data/. /tmp/bf/
          n=$(ls /tmp/bf/*.json 2>/dev/null | wc -l)
          echo "暫存 $n 個檔"
          # 🚧 空過守門:暫存數量不對就不要動 data 分支(⛔ 寧可不推,也不要推壞的)
          if [ "$n" -lt 500 ]; then echo "::error::暫存只有 $n 檔 → 中止,不推分支"; exit 1; fi

          git config user.name  "StockAI Bot"
          git config user.email "bot@users.noreply.github.com"
          git reset --hard && git clean -fdq
          git fetch --depth=1 origin data
          git checkout -f -B data origin/data
          rm -rf data && mkdir -p data
          cp -a /tmp/bf/. data/
          git add -f data
          if git diff --cached --quiet; then
            echo "✅ 沒有任何變更(可能都已補滿)→ 不 commit"
          else
            git commit -q -m "🏦 法人/融資券歷史回補 $(date -u +%Y-%m-%d)"
            for i in 1 2 3 4; do
              git push origin data && break || { echo "push 失敗,第 $i 次重試"; sleep $((2**i)); }
            done
            echo "✅ 已推回 data 分支"
          fi

      # ── 🗄️ deep 模式 ───────────────────────────────────────────────
      - name: 🗄️ deep:還原已抓過的 + 做母體清單
        if: github.event.inputs.mode == 'deep'
        run: |
          set -e
          mkdir -p inst_deep
          if git fetch --depth=1 origin inst_deep 2>/dev/null; then
            git archive FETCH_HEAD inst_deep | tar -x || true
          fi
          echo "已經有 $(ls inst_deep/*.json.gz 2>/dev/null | wc -l) 檔(這些會跳過)"
          git fetch --depth=1 origin klines_deep
          git ls-tree --name-only FETCH_HEAD klines_deep/ | sed -E 's#^klines_deep/##; s#\.json\.gz$##' > /tmp/universe.txt
          ls data/*.json | sed -E 's#^data/##; s#\.json$##' >> /tmp/universe.txt
          echo "母體候選 $(sort -u /tmp/universe.txt | wc -l) 個代號(程式會再只留 4 碼個股)"

      - name: 🗄️ deep:抓 2012~2023-06 個股法人
        if: github.event.inputs.mode == 'deep'
        env:
          FINMIND_TOKENS: ${{ secrets.FINMIND_TOKENS }}
          LIMIT: ${{ github.event.inputs.limit }}
          MAX_MIN: ${{ github.event.inputs.max_min }}
          MODE: deep
          UNIVERSE: /tmp/universe.txt
        run: |
          python3 inst_backfill.py --selftest
          python3 inst_backfill.py

      # ⚠️ 順序同上:先把 inst_deep/ 搬到 /tmp,切完分支再搬回來
      - name: 🗄️ deep:推到 inst_deep 分支
        if: github.event.inputs.mode == 'deep'
        run: |
          set -e
          n=$(ls inst_deep/*.json.gz 2>/dev/null | wc -l)
          echo "要推 $n 檔"
          [ "$n" -gt 0 ] || { echo "::error::一檔都沒有 → 不推"; exit 1; }
          rm -rf /tmp/deep && mkdir -p /tmp/deep && cp -a inst_deep/. /tmp/deep/
          git config user.name  "StockAI Bot"
          git config user.email "bot@users.noreply.github.com"
          git reset --hard -q && git clean -fdq
          if git fetch --depth=1 origin inst_deep 2>/dev/null; then
            git checkout -f -B inst_deep FETCH_HEAD
          else
            git checkout -q --orphan inst_deep
            git rm -rq --cached . 2>/dev/null || true
            git clean -fdq
          fi
          rm -rf inst_deep && mkdir -p inst_deep && cp -a /tmp/deep/. inst_deep/
          git add -f inst_deep
          if git diff --cached --quiet; then echo "✅ 沒有新檔 → 不 commit"; exit 0; fi
          git commit -q -m "🗄️ 個股法人深歷史 $n 檔 $(date -u +%Y-%m-%d)"
          pushed=0
          # ⛔ 這個 retry 迴圈不可拿掉
          for i in 1 2 3 4 5; do
            git push origin inst_deep && { pushed=1; echo "✅ 已推上 inst_deep(第 $i 次)"; break; }
            sleep $((i * 3))
            git pull --rebase origin inst_deep 2>/dev/null || true
          done
          [ "$pushed" -eq 1 ] || { echo "::error::push 連 5 次失敗"; exit 1; }

      - name: ✅ 完成
        run: echo "回補完成(fill:明天 daily_miner 會把它讀回 SQLite 再匯出 ・deep:git ls-tree origin/inst_deep 看檔數)"
