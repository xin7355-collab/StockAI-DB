name = "stockai-alerts"
main = "worker.js"
compatibility_date = "2026-06-01"

# 💾 KV namespace 綁定(部署前先跑 `wrangler kv:namespace create "KV"` 然後把 id 貼進來)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# 🕐 排程:台北 09:00-13:30 每 30 分(UTC 01:00-05:30,Mon-Fri)
[triggers]
crons = ["*/30 1-5 * * 1-5"]

# 🛡️ Secrets(用 `wrangler secret put XXX` 設定,不要寫在這個檔)
#   TELEGRAM_BOT_TOKEN   ← BotFather 給的 token,必填
#   WEBHOOK_SECRET       ← 自訂亂數,選填,防偽造 webhook
