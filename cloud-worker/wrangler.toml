name = "stockai-alerts"
main = "worker.js"
compatibility_date = "2026-06-01"

# 💾 KV namespace 綁定(部署前先跑 `wrangler kv:namespace create "KV"` 然後把 id 貼進來)
[[kv_namespaces]]
binding = "KV"
id = "9d4249726b324b38892a69b9992cdb4d"

# 🕐 排程(UTC → 台北 +8;全部只在平日):
#   "0,15,30,45 1-4 * * MON-FRI" — 台北 09:00~12:45 每 15 分:盤中個人警報 + 盤中採礦看門狗
#   "0,15,30 5 * * MON-FRI"      — 台北 13:00 / 13:15 / 13:30:盤中末班
#   "0 0 * * MON-FRI"            — 🌅 台北 08:00 盤前簡報 + 👑 換倉推播 + 叫醒總經採礦 / 盤中快照
#   "0 1 * * MON-FRI"            — 台北 09:00 開盤:ETF 跟單 + 叫醒逐筆內外盤
#   "0 9 * * MON-FRI"            — 🌆 台北 17:00 盤後總結 + 叫醒每日採礦
# 🗓️ V22.7(2026-10-23)星期欄一律寫 MON-FRI —— ⛔ 不可寫數字 1-5。
#   Cloudflare 的星期是 1 = 週日 … 7 = 週六(跟 GitHub / Linux 的 0 = 週日不一樣),
#   以前寫 "1-5" = 週日~週四 → 每個星期五整天沒跑(盤前簡報 / 盤中提醒 / 叫醒採礦全停),週日反而白跑
#   (GitHub 紀錄:Worker 叫醒盤中快照那筆 10/18 週日有、10/16・10/23 週五都沒有)。
#   ⚠️ worker.js 的 CRON 要跟這裡一字不差(scripts/test_worker_cron.mjs 比對)。
[triggers]
crons = [
  "0,15,30,45 1-4 * * MON-FRI",
  "0,15,30 5 * * MON-FRI",
  "0 0 * * MON-FRI",
  "0 1 * * MON-FRI",
  "0 9 * * MON-FRI"
]

# 🛡️ Secrets(用 `wrangler secret put XXX` 設定,不要寫在這個檔)
#   TELEGRAM_BOT_TOKEN   ← BotFather 給的 token,必填
#   WEBHOOK_SECRET       ← 自訂亂數,選填,防偽造 webhook
#   GEMINI_API_KEY       ← Gemini API key,選填(沒設則每日總結不附 AI 短評)
